# SCAI — read-only Windows ARM64 source smoke test.
#
# It never creates a release or publishes updater metadata. By default it only
# compiles an arbitrary private source ref on the windows-11-arm runner used by
# the release lane; an explicit `bundle` input additionally yields a short-lived
# NSIS artifact for physical-device proof before the public release.

name: Windows ARM64 smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag oder SHA im privaten Quell-Repo"
        required: true
        default: "main"
      bundle:
        description: "Nach grünem Smoke einen testbaren NSIS-Installer als CI-Artefakt bauen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-arm-smoke-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows ARM64 build smoke
    runs-on: windows-11-arm
    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      # Wie in build-all.yml/pr-check.yml: Git Bash statt actions/checkout mit
      # SSH-Key, weil der windows-11-arm-Runner kein verlässliches System-OpenSSH
      # bereitstellt. Der private Key bleibt ausschließlich im Step-Prozess.
      - name: Quellcode auschecken (privates Repo, read-only Deploy-Key)
        shell: bash
        env:
          SRC_REF: ${{ inputs.ref }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="$HOME/.ssh/scai_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"

          # Fetch by ref into an empty repository so branch, tag, and commit SHA
          # inputs all use the same path. No source ref is interpolated into a
          # shell expression; it remains one quoted git argument.
          git init src
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 origin "$SRC_REF"
          git -C src checkout --detach FETCH_HEAD
          echo "ausgecheckt: $SRC_REF → $(git -C src rev-parse --short HEAD)"

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Rust einrichten (aarch64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Abhängigkeiten installieren
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" arm64-npm-ci npm ci

      - name: Frontend bauen (tsc + vite)
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" arm64-frontend-build npm run build

      # whisper.cpp/ggml verweigert ARM mit dem MSVC-C-Compiler ausdrücklich.
      # Rust bleibt beim offiziellen *-msvc Target; nur der native C/C++-Teil
      # wird über ClangCL + Ninja für ARM64 gebaut.
      - name: ClangCL für native ARM64-Meet-Abhängigkeiten aktivieren
        shell: pwsh
        run: |
          clang-cl --version
          ninja --version
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CC_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          "CXX_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS_aarch64_pc_windows_msvc=/EHsc" >> $env:GITHUB_ENV

      - name: Rust ARM64 prüfen (locked)
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" arm64-cargo-check cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-pc-windows-msvc --locked --features local-meet

      - name: ARM64-Vorschauinstaller bauen
        if: inputs.bundle
        working-directory: src
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY fehlt — kein unsigniertes Update-Artefakt erzeugen."
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" arm64-preview-build \
            npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis --features local-meet

      - name: ARM64-Vorschauinstaller bereitstellen
        if: inputs.bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-windows-arm64-preview-${{ github.run_id }}
          path: |
            src/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 7
