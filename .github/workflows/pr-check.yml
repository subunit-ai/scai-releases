# SCAI — PR-Check (tsc + vite + cargo test) für das PRIVATE Quell-Repo.
#
# WARUM hier (im PUBLIC scai-releases) statt im privaten subunit-scai:
# GitHub rechnet Actions-Minuten nach dem Repo ab, in dem der Workflow LÄUFT.
# `subunit-scai` ist privat → dessen Actions hängen an der Org-Billing-Sperre
# (Jobs sterben nach 3s mit 0 Steps). `scai-releases` ist public → KOSTENLOS.
# Der Quellcode wird per read-only Deploy-Key ausgecheckt (Muster build-all.yml).
#
# SICHERHEIT: Trigger ist AUSSCHLIESSLICH workflow_dispatch — Forks können den
# Workflow nicht mit unseren Secrets starten. Nur wer Schreibrechte auf DIESES
# Repo hat, kann ihn auslösen.
#
# AUSGELÖST VON: scripts/session/ship.sh im Quell-Repo (vor dem Squash-Merge).
#   gh workflow run pr-check.yml -R subunit-ai/scai-releases -f ref=<40sha> -f request_id=<uuidv4>
# ship.sh wartet auf die Conclusion dieses Runs und merged nur bei grün.

name: PR Check (Quell-Repo)
run-name: SCAI PR · ${{ inputs.ref }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exakter unveränderlicher 40-Zeichen-SHA im privaten Quell-Repo"
        required: true
        type: string
      request_id:
        description: "Neue eindeutige UUIDv4 für diesen Source-Prüfauftrag"
        required: true
        type: string
      trace_ref:
        description: "Optionaler exakter 40-Zeichen-SHA aus trace-tauri für den Standalone-Matrixcheck"
        required: false
        default: ""
      diagnostic_public_key_base64:
        description: "Optionaler einmaliger RSA-3072+-Public-Key im PEM-Base64-Format für verschlüsselte private Fehlerdiagnostik"
        required: false
        default: ""
      trace_bundle_public_key_base64:
        description: "Optionaler einmaliger RSA-3072+-Public-Key für einen verschlüsselten, intern signierten Trace-macOS-Bundle"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pr-check-${{ inputs.ref }}-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Exakten Source-Prüfauftrag ohne private Schlüssel validieren
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      trace_sha: ${{ steps.request.outputs.trace_sha }}
    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false
      - name: Source und Request fail-closed prüfen
        id: request
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          REQUEST_ID: ${{ inputs.request_id }}
          TRACE_SHA: ${{ inputs.trace_ref }}
          TRACE_BUNDLE_KEY: ${{ inputs.trace_bundle_public_key_base64 }}
        run: node gate/scripts/verify-source-confidentiality.mjs --pr-request

  check:
    needs: preflight
    if: needs.preflight.result == 'success'
    name: tsc + vite + cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Trace-Artefakt-Inputvertrag prüfen
        shell: bash
        env:
          TRACE_REF: ${{ inputs.trace_ref }}
          TRACE_BUNDLE_KEY: ${{ inputs.trace_bundle_public_key_base64 }}
        run: |
          set -euo pipefail
          if [ -n "$TRACE_BUNDLE_KEY" ] && [ -z "$TRACE_REF" ]; then
            echo "::error::Ein Trace-Bundle-Empfängerschlüssel erfordert einen exakten trace_ref."
            exit 1
          fi

      # Bun wird vor dem privaten Checkout bereitgestellt. Die gepinnte Action sieht
      # damit keinen proprietären Source-Tree; alle späteren Testausgaben bleiben im
      # Confidential-Runner.
      - name: Bun einrichten
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, immutable

      # Frontend-Vertragstests kompilieren bereits einen echten Rust-Vertrag.
      # Toolchain-Provisionierung gehört vor diese Tests und vor privaten Source,
      # nicht in das begrenzte Compiler-Kind des Tests.
      - name: Rust für compilerführende Frontendtests einrichten
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable
        timeout-minutes: 5

      - name: Rust-Compiler vor privaten Tests prüfen
        shell: bash
        timeout-minutes: 2
        run: rustc --version --verbose

      # Klon über Git Bash statt actions/checkout+ssh-key (siehe build-all.yml).
      # Ref + Key über env, nicht inline → Injection-sicher.
      - name: Quellcode auschecken (privates Repo, read-only Deploy-Key)
        shell: bash
        env:
          SRC_REF: ${{ needs.preflight.outputs.source_sha }}
          REQUEST_ID: ${{ needs.preflight.outputs.request_id }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/gate/scripts/validate-private-source-ref.sh" "$SRC_REF"
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          key_file="$HOME/.ssh/scai_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"
          git init src
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 -- origin "$SRC_REF"
          git -C src checkout --detach FETCH_HEAD
          ACTUAL_SHA=$(git -C src rev-parse HEAD)
          if printf '%s' "$SRC_REF" | grep -Eq '^[0-9a-f]{40}$' && [ "$ACTUAL_SHA" != "$SRC_REF" ]; then
            echo "::error::Checkout-Drift: erwartet $SRC_REF, erhalten $ACTUAL_SHA"
            exit 1
          fi
          cleanup
          trap - EXIT
          echo "ausgecheckt: $SRC_REF → $ACTUAL_SHA"
          echo "PASS private-checkout-scai (source-sha=$ACTUAL_SHA, request-id=$REQUEST_ID)"

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" npm-ci npm ci

      - name: Frontend-Vertragstests ausführen
        id: frontend_unit_tests
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-frontend-unit-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" frontend-unit-tests bun test src/lib

      - name: Verschlüsselte Frontend-Vertragstest-Fehlerdiagnostik bereitstellen
        if: failure() && steps.frontend_unit_tests.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-frontend-unit-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-frontend-unit-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Web- und Release-Fixture-Verträge prüfen
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" web-release-fixture-tests npm run test:web

      - name: Plugin-Deploy-Snapshot und Fehlergrenzen prüfen
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" plugin-deploy-tests npm run test:plugin-deploy

      # Vendored subunit-CLI muss mit Manifest/Signing-Key/Bundle-Wiring synchron
      # bleiben — schlägt bei veraltetem/handgepatchtem Vendor fehl.
      - name: CLI-Drift-Wächter
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" cli-drift npm run drift-guard

      # Release-Meta: EINE Version in allen 5 Dateien + Changelog-Eintrag für sie.
      # Ohne den Eintrag bleibt das „Was ist neu"-Popup nach dem Update leer (genau
      # das passierte bei v0.16.0). Beim Lesen des Diffs sieht man das nicht — die
      # Maschine schon.
      - name: Release-Meta-Wächter
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" release-meta npm run check:release-meta

      # Jedes Plugin muss als eigenständiges Bundle bauen. Der App-Build (vite) deckt
      # das NICHT ab: die Plugin-Bundles laufen durch esbuild mit anderen Defines.
      # Gemessen: eine neue `import.meta.env.PROD`-Nutzung in lib/config.ts ließ den
      # chat-Bau scheitern — bemerkt erst beim Publish, und der ganze Release-Zug stand.
      - name: Plugin-Bundles bauen (Probe)
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" plugin-bundles npm run check:plugins

      # SCAI wurde als Demo gebaut und wird als Enterprise-Produkt verkauft. Seeds
      # ("Max Mustermann"), echte Kundennamen und Attrappen-Antworten dürfen nicht wieder
      # einsickern. Der Wächter hängt bewusst HIER und nicht nur im Quell-Repo: dessen
      # Actions sind billing-gesperrt (jeder Lauf stirbt nach ~4 s mit 0 Steps), der Step
      # dort läuft also nie. Diese Pipeline ist die einzige, die wirklich prüft.
      - name: Keine Demo-Daten im Produktcode
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" no-demo-data npm run check:no-demo-data

      - name: Bauen (tsc + vite)
        id: frontend_build
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-frontend-build-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" frontend-build npm run build

      - name: Verschlüsselte Frontend-Build-Fehlerdiagnostik bereitstellen
        if: failure() && steps.frontend_build.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-frontend-build-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-frontend-build-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Browser für Seh-Harnesse
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" playwright-install npx playwright install --with-deps chromium webkit

      - name: Sicherheitsgrenzen in Browser und Plugin-Bundles beweisen
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/plugins/maplibre-sanitizer.test.mjs ] || [ -f scripts/plugins/media-viewer.test.mjs ]; then
            bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" browser-security-proof npm run test:security-browser
          fi

      # Der öffentliche Runner entwickelt sich unabhängig vom privaten Source-Repo.
      # Neue Feature-Proofs dürfen ältere/offene Source-Refs nicht rückwirkend brechen;
      # sobald das Harness im angeforderten Ref existiert, bleibt der Proof strikt.
      - name: Optionale Source-Proofs erkennen
        id: source_proofs
        working-directory: src
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/detect-recovered-source-proofs.sh" . >> "$GITHUB_OUTPUT"
          if [ -f scripts/verify-support-diagnostics.mjs ]; then
            echo "support_diagnostics=true" >> "$GITHUB_OUTPUT"
          else
            echo "support_diagnostics=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-sentinel-forecast.mjs ]; then
            echo "sentinel_forecast=true" >> "$GITHUB_OUTPUT"
          else
            echo "sentinel_forecast=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-sentinel-crm-2026.mjs ]; then
            echo "sentinel_crm=true" >> "$GITHUB_OUTPUT"
          else
            echo "sentinel_crm=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-sentinel-routing.mjs ]; then
            echo "sentinel_routing=true" >> "$GITHUB_OUTPUT"
          else
            echo "sentinel_routing=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-chat-dock.mjs ]; then
            echo "chat_dock=true" >> "$GITHUB_OUTPUT"
          else
            echo "chat_dock=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-aenderungsjournal.mjs ]; then
            echo "aenderungsjournal=true" >> "$GITHUB_OUTPUT"
          else
            echo "aenderungsjournal=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-workgraph-blackbox.mjs ]; then
            echo "workgraph_blackbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "workgraph_blackbox=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-moco-parity.mjs ]; then
            echo "moco_parity=true" >> "$GITHUB_OUTPUT"
          else
            echo "moco_parity=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-workforce-capacity-overlays.mjs ]; then
            echo "workforce_capacity=true" >> "$GITHUB_OUTPUT"
          else
            echo "workforce_capacity=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f scripts/verify-workforce-inbox.mjs ]; then
            echo "workforce_inbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "workforce_inbox=false" >> "$GITHUB_OUTPUT"
          fi
          subunit_call_host=false
          subunit_call_proof=false
          [ ! -f src/call/CallSessionHost.tsx ] || subunit_call_host=true
          [ ! -f scripts/verify-subunit-call.mjs ] || subunit_call_proof=true
          if [ "$subunit_call_host" = true ] && [ "$subunit_call_proof" = true ]; then
            echo "subunit_call=true" >> "$GITHUB_OUTPUT"
          elif [ "$subunit_call_host" = false ] && [ "$subunit_call_proof" = false ]; then
            echo "subunit_call=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Subunit-Call-Proof ist unvollständig; Call-Host und Proof-Harness müssen gemeinsam vorliegen."
            exit 1
          fi
          workspace_tabs=false
          workspace_app_plugins=false
          [ ! -f scripts/verify-workspace-tabs.mjs ] || workspace_tabs=true
          [ ! -f scripts/verify-workspace-app-plugins.mjs ] || workspace_app_plugins=true
          if [ "$workspace_tabs" = true ] && [ "$workspace_app_plugins" = true ]; then
            echo "workspace_browser=true" >> "$GITHUB_OUTPUT"
          elif [ "$workspace_tabs" = false ] && [ "$workspace_app_plugins" = false ]; then
            echo "workspace_browser=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Arbeitsbereich-Browser-Proof ist unvollständig; Web- und App-Modus-Harness müssen gemeinsam vorliegen."
            exit 1
          fi
          billing_revenue=false
          offers_revenue=false
          [ ! -f scripts/verify-billing-production.mjs ] || billing_revenue=true
          [ ! -f scripts/verify-offers-v01.mjs ] || offers_revenue=true
          if [ "$billing_revenue" = true ] && [ "$offers_revenue" = true ]; then
            echo "revenue_browser=true" >> "$GITHUB_OUTPUT"
          elif [ "$billing_revenue" = false ] && [ "$offers_revenue" = false ]; then
            echo "revenue_browser=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Revenue-Browser-Proof ist unvollständig; Billing- und Offers-Harness müssen gemeinsam vorliegen."
            exit 1
          fi

      - name: Subunit Call im Browser einschließlich Aufnahme und Native-Quit-Schutz beweisen
        id: subunit_call_proof
        if: always() && steps.source_proofs.outputs.subunit_call == 'true'
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-subunit-call-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" subunit-call-proof node scripts/verify-subunit-call.mjs

      - name: Verschlüsselte Subunit-Call-Fehlerdiagnostik bereitstellen
        if: failure() && steps.subunit_call_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-subunit-call-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-subunit-call-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Restored email-full-peek contract beweisen
        id: email_full_peek_proof
        if: always() && steps.source_proofs.outputs.email_full_peek == 'true'
        working-directory: src
        shell: bash
        env:
          SCAI_TOOLCHAIN: ${{ github.workspace }}/src
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-email-full-peek-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" email-full-peek-proof node scripts/verify-email-full-peek.mjs

      - name: Verschluesselte email-full-peek Fehlerdiagnostik bereitstellen
        if: failure() && steps.email_full_peek_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-email-full-peek-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-email-full-peek-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Restored backoffice-capacity contract beweisen
        id: backoffice_capacity_proof
        if: always() && steps.source_proofs.outputs.backoffice_capacity == 'true'
        working-directory: src
        shell: bash
        env:
          SCAI_TOOLCHAIN: ${{ github.workspace }}/src
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-backoffice-capacity-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" backoffice-capacity-proof node scripts/verify-backoffice-capacity-list.mjs

      - name: Verschluesselte backoffice-capacity Fehlerdiagnostik bereitstellen
        if: failure() && steps.backoffice_capacity_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-backoffice-capacity-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-backoffice-capacity-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Restored agents-os contract beweisen
        id: agents_os_proof
        if: always() && steps.source_proofs.outputs.agents_os == 'true'
        working-directory: src
        shell: bash
        env:
          SCAI_TOOLCHAIN: ${{ github.workspace }}/src
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-agents-os-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" agents-os-proof bash "$GITHUB_WORKSPACE/gate/scripts/run-agents-os-proof.sh"

      - name: Verschluesselte agents-os Fehlerdiagnostik bereitstellen
        if: failure() && steps.agents_os_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-agents-os-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-agents-os-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Verschluesselte agents-os Visualbelege bereitstellen
        if: always() && steps.source_proofs.outputs.agents_os == 'true' && (steps.agents_os_proof.outcome == 'success' || steps.agents_os_proof.outcome == 'failure') && steps.agents_os_proof.outputs.encrypted_visual_receipt == 'true' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-agents-os-encrypted-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-agents-os-encrypted-proof.json
          if-no-files-found: error
          retention-days: 1

      - name: Restored workforce-coordination contract beweisen
        id: workforce_coordination_proof
        if: always() && steps.source_proofs.outputs.workforce_coordination == 'true'
        working-directory: src
        shell: bash
        env:
          SCAI_TOOLCHAIN: ${{ github.workspace }}/src
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-workforce-coordination-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" workforce-coordination-proof bash "$GITHUB_WORKSPACE/gate/scripts/run-workforce-coordination-proof.sh"

      - name: Verschluesselte workforce-coordination Fehlerdiagnostik bereitstellen
        if: failure() && steps.workforce_coordination_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-workforce-coordination-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-workforce-coordination-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Verschluesselte workforce-coordination Visualbelege bereitstellen
        if: always() && steps.source_proofs.outputs.workforce_coordination == 'true' && (steps.workforce_coordination_proof.outcome == 'success' || steps.workforce_coordination_proof.outcome == 'failure') && steps.workforce_coordination_proof.outputs.encrypted_visual_receipt == 'true' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-workforce-coordination-encrypted-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-workforce-coordination-encrypted-proof.json
          if-no-files-found: error
