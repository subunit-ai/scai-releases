        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" sentinel-crm-proof npm run proof:sentinel-crm

      - name: Sentinel-CRM-Proof-Screenshots vorhanden
        if: always() && steps.sentinel_crm_proof.outcome != 'skipped'
        shell: bash
        run: find "$HOME/.cache/u1-shots/sentinel-crm-2026/" -type f -name '*.png' -print -quit | grep -q .

      - name: Sentinel-CRM-Proof-Screenshots sichern
        if: always() && steps.sentinel_crm_proof.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-sentinel-crm-proof-${{ github.run_id }}
          path: ~/.cache/u1-shots/sentinel-crm-2026/
          if-no-files-found: error
          retention-days: 14

      - name: Verschlüsselte Sentinel-CRM-Fehlerdiagnostik bereitstellen
        if: failure() && steps.sentinel_crm_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-sentinel-crm-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-sentinel-crm-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Sentinel Forecast Command Desk beweisen
        id: forecast_proof
        if: steps.source_proofs.outputs.sentinel_forecast == 'true'
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" sentinel-forecast-proof node scripts/verify-sentinel-forecast.mjs

      - name: Sentinel-Forecast-Screenshots vorhanden
        if: always() && steps.forecast_proof.outcome != 'skipped'
        shell: bash
        run: find "$HOME/.cache/u1-shots/sentinel-forecast/" -type f -name '*.png' -print -quit | grep -q .

      - name: Sentinel-Forecast-Screenshots sichern
        if: always() && steps.forecast_proof.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-sentinel-forecast-proof-${{ github.run_id }}
          path: ~/.cache/u1-shots/sentinel-forecast/
          if-no-files-found: error
          retention-days: 14

      - name: Sentinel Lead Ownership und SLA Routing beweisen
        id: routing_proof
        if: steps.source_proofs.outputs.sentinel_routing == 'true'
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-sentinel-routing-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" sentinel-routing-proof node scripts/verify-sentinel-routing.mjs

      - name: Sentinel-Routing-Screenshots vorhanden
        if: always() && steps.routing_proof.outcome != 'skipped'
        shell: bash
        run: find "$HOME/.cache/u1-shots/sentinel-routing/" -type f -name '*.png' -print -quit | grep -q .

      - name: Sentinel-Routing-Screenshots sichern
        if: always() && steps.routing_proof.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-sentinel-routing-proof-${{ github.run_id }}
          path: ~/.cache/u1-shots/sentinel-routing/
          if-no-files-found: error
          retention-days: 14

      - name: Verschlüsselte Sentinel-Routing-Fehlerdiagnostik bereitstellen
        if: failure() && steps.routing_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-sentinel-routing-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-sentinel-routing-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Arbeitsbereich mit Tabs und geteilten Flächen im Web beweisen
        id: workspace_tabs_proof
        if: steps.source_proofs.outputs.workspace_browser == 'true'
        working-directory: src
        shell: bash
        env:
          SCAI_WORKSPACE_PROOF_OUT: ${{ runner.temp }}/scai-workspace-tabs
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-workspace-tabs-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" workspace-tabs-proof node scripts/verify-workspace-tabs.mjs

      - name: Arbeitsbereich mit App-Modus-Plugins beweisen
        id: workspace_app_plugins_proof
        if: steps.source_proofs.outputs.workspace_browser == 'true'
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-workspace-app-plugins-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" workspace-app-plugins-proof node scripts/verify-workspace-app-plugins.mjs

      - name: Verschlüsselte Arbeitsbereich-Tabs-Fehlerdiagnostik bereitstellen
        if: failure() && steps.workspace_tabs_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-workspace-tabs-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-workspace-tabs-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Verschlüsselte Arbeitsbereich-App-Plugins-Fehlerdiagnostik bereitstellen
        if: failure() && steps.workspace_app_plugins_proof.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-workspace-app-plugins-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-workspace-app-plugins-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Arbeitsbereich-Proof-Screenshots geschlossen prüfen
        if: always() && steps.workspace_tabs_proof.outcome != 'skipped' && steps.workspace_app_plugins_proof.outcome != 'skipped'
        shell: bash
        env:
          WORKSPACE_TABS_PROOF_DIR: ${{ runner.temp }}/scai-workspace-tabs
        run: |
          test -s "$WORKSPACE_TABS_PROOF_DIR/desktop-dark-split.png"
          test -s "$WORKSPACE_TABS_PROOF_DIR/mobile-light-areas.png"
          test -s "$WORKSPACE_TABS_PROOF_DIR/mobile-dark.png"
          test -s "$HOME/.cache/u1-shots/scai-workspace-app-plugins/dashboard-two-instances.png"
          test -s "$HOME/.cache/u1-shots/scai-workspace-app-plugins/halo-two-instances.png"
          test -s "$HOME/.cache/u1-shots/scai-workspace-app-plugins/native-menu-bridge.png"

      # Rust-Kompilat + Unit-Tests. Tauri v2 linkt webkit2gtk/gtk auch für
      # `cargo test` → Systembibliotheken nötig.
      - name: Tauri-Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libasound2-dev

      # Der read-only Trace-Key wird erst nach allen Third-Party-Actions
      # bereitgestellt und nach dem privaten Cargo-Aufruf wieder entfernt.
      - name: Privaten Trace-Kern für Cargo freischalten (read-only)
        shell: bash
        env:
          TRACE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TRACE_DEPLOY_KEY:-}" ]; then
            echo "::error::TRACE_SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TRACE_DEPLOY_KEY" > "$HOME/.ssh/trace_src"
          chmod 600 "$HOME/.ssh/trace_src"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-trace
            HostName github.com
            User git
            IdentityFile ~/.ssh/trace_src
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          git config --global url."git@github-trace:subunit-ai/trace-tauri.git".insteadOf \
            "https://github.com/subunit-ai/trace-tauri.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: cargo test (Sidecar-Trust-Modell + halo + verify-Suite)
        id: cargo_test
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-cargo-test-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" cargo-test cargo test --manifest-path src-tauri/Cargo.toml --lib --features local-meet

      # Presence S3 (Quell-Repo docs/presence-wsl-hook.md): Hook-Helfer und sein
      # Schwärzungs-Kern sind eigene Workspace-Mitglieder; `--lib` des App-Pakets
      # erfasst ihre eigenen Tests nicht.
      - name: cargo test Agenten-Hook (Helfer + Schwärzungs-Kern)
        id: agent_hook_test
        if: hashFiles('src/src-tauri/crates/scai-agent-hook/Cargo.toml') != ''
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-agent-hook-test-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" agent-hook-test cargo test --locked --manifest-path src-tauri/Cargo.toml -p scai-agent-hook -p scai-agent-hook-core --all-features

      - name: Verschlüsselte Cargo-Test-Fehlerdiagnostik bereitstellen
        if: failure() && steps.cargo_test.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-cargo-test-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-cargo-test-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Verschlüsselte Agenten-Hook-Test-Fehlerdiagnostik bereitstellen
        if: failure() && steps.agent_hook_test.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-agent-hook-test-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-agent-hook-test-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Private Trace-Credentials entfernen
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/trace_src"
          git config --global --unset-all url.git@github-trace:subunit-ai/trace-tauri.git.insteadOf || true

  trace-standalone:
    needs: preflight
    name: Trace Standalone prüfen (${{ matrix.label }})
    if: inputs.trace_ref != '' && needs.preflight.result == 'success'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-core
            mode: core
          - runner: macos-15
            label: macos-arm64
            mode: native
          - runner: macos-15-intel
            label: macos-x64
            mode: native
          - runner: windows-2025
            label: windows-x64
            mode: native
            openssl_triplet: x64-windows-static-md
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Exakten privaten Trace-Stand auschecken (read-only)
        shell: bash
        env:
          SRC_REF: ${{ needs.preflight.outputs.trace_sha }}
          REQUEST_ID: ${{ needs.preflight.outputs.request_id }}
          DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SRC_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trace_ref muss ein unveränderlicher 40-Zeichen-SHA sein."
            exit 1
          fi
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::TRACE_SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          key_file="$HOME/.ssh/trace_matrix_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"
          git init trace-src
          git -C trace-src remote add origin git@github.com:subunit-ai/trace-tauri.git
          git -C trace-src fetch --depth 1 -- origin "$SRC_REF"
          git -C trace-src checkout --detach FETCH_HEAD
          ACTUAL_SHA=$(git -C trace-src rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$SRC_REF" ]; then
            echo "::error::Trace-Checkout-Drift: erwartet $SRC_REF, erhalten $ACTUAL_SHA"
            exit 1
          fi
          cleanup
          trap - EXIT
          echo "Trace ausgecheckt: $ACTUAL_SHA"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable
        with:
          components: rustfmt, clippy

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: OpenSSL für Trace-SQLCipher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENSSL_TRIPLET: ${{ matrix.openssl_triplet }}
        run: |
          if (-not $env:OPENSSL_TRIPLET) { throw "OpenSSL-vcpkg-Triplet fehlt" }
          vcpkg install "openssl:$env:OPENSSL_TRIPLET"
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$env:OPENSSL_TRIPLET" >> $env:GITHUB_ENV

      - name: Formatvertrag prüfen
        if: matrix.mode == 'core'
        working-directory: trace-src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-fmt cargo fmt -- --check

      - name: Plattformneutralen Core prüfen
        if: matrix.mode == 'core'
        working-directory: trace-src
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-core-check cargo check --locked
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-core-clippy cargo clippy --locked -- -D warnings
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-core-test cargo test --locked

      - name: Nativen Standalone-Host prüfen
        if: matrix.mode == 'native'
        working-directory: trace-src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ matrix.label == 'windows-x64' && inputs.diagnostic_public_key_base64 || '' }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ matrix.label == 'windows-x64' && inputs.diagnostic_public_key_base64 != '' && format('{0}/trace-windows-diagnostic.json', runner.temp) || '' }}
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-native-check cargo check --locked --features host --bin trace-host
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-native-clippy cargo clippy --locked --features host --all-targets -- -D warnings
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-native-test cargo test --locked --features host
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-native-build cargo build --release --locked --features host --bin trace-host

      - name: Einmaligen Trace-Artefakt-Empfängerschlüssel prüfen
        if: matrix.label == 'macos-arm64' && inputs.trace_bundle_public_key_base64 != ''
        shell: bash
        env:
          RECIPIENT_PUBLIC_KEY_BASE64: ${{ inputs.trace_bundle_public_key_base64 }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/trace-key-preflight"
          node "$GITHUB_WORKSPACE/gate/scripts/encrypt-confidential-log.mjs" \
            "$RUNNER_TEMP/trace-key-preflight" \
            "$RUNNER_TEMP/trace-key-preflight.envelope.json" \
            "$RECIPIENT_PUBLIC_KEY_BASE64"
          rm -f "$RUNNER_TEMP/trace-key-preflight" "$RUNNER_TEMP/trace-key-preflight.envelope.json"

      # Wichtig: Dieses private Source-Script läuft VOR dem Import der Signing-Secrets. Danach
      # werden ausschließlich fest im öffentlichen Gate definierte Apple-Werkzeuge ausgeführt.
      - name: Trace-App ohne vertrauliche Codeidentität vorpaketieren
        if: matrix.label == 'macos-arm64' && inputs.trace_bundle_public_key_base64 != ''
        working-directory: trace-src
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$RUNNER_TEMP/trace-host-macos-arm64-internal"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          mkdir "$bundle_root"
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-macos-app-package \
            bash scripts/build-macos-app.sh \
              target/release/trace-host \
              "$bundle_root/Trace Host.app" \
              - \
              "$version"
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" trace-macos-setup-package \
            bash scripts/build-macos-setup-app.sh \
              "$bundle_root/Trace einrichten.app" \
              - \
              "$version"
          test -d "$bundle_root/Trace Host.app"
          test ! -L "$bundle_root/Trace Host.app"
          test -f "$bundle_root/Trace Host.app/Contents/Info.plist"
          test ! -L "$bundle_root/Trace Host.app/Contents/Info.plist"
          test -x "$bundle_root/Trace Host.app/Contents/MacOS/trace-host"
          test ! -L "$bundle_root/Trace Host.app/Contents/MacOS/trace-host"
          test -z "$(find "$bundle_root/Trace Host.app" -type l -print -quit)"
          test "$(plutil -extract CFBundleIdentifier raw "$bundle_root/Trace Host.app/Contents/Info.plist")" = "ai.subunit.trace-host"
          codesign --verify --deep --strict --verbose=2 "$bundle_root/Trace Host.app"
          test -d "$bundle_root/Trace einrichten.app"
          test ! -L "$bundle_root/Trace einrichten.app"
          test -f "$bundle_root/Trace einrichten.app/Contents/Info.plist"
          test ! -L "$bundle_root/Trace einrichten.app/Contents/Info.plist"
          test -x "$bundle_root/Trace einrichten.app/Contents/MacOS/trace-setup"
          test ! -L "$bundle_root/Trace einrichten.app/Contents/MacOS/trace-setup"
          test -z "$(find "$bundle_root/Trace einrichten.app" -type l -print -quit)"
          test "$(plutil -extract CFBundleIdentifier raw "$bundle_root/Trace einrichten.app/Contents/Info.plist")" = "ai.subunit.trace-setup"
          codesign --verify --deep --strict --verbose=2 "$bundle_root/Trace einrichten.app"
          ln -s "Trace Host.app/Contents/MacOS/trace-host" "$bundle_root/trace-host"
          cp README.md docs/PILOT-RUNBOOK.md "$bundle_root/"

      - name: Interne macOS-Codeidentität für Trace importieren
        if: matrix.label == 'macos-arm64' && inputs.trace_bundle_public_key_base64 != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "${APPLE_CERTIFICATE:-}"
          test -n "${APPLE_SIGNING_IDENTITY:-}"
          case "$APPLE_SIGNING_IDENTITY" in
            "Apple Development:"*|"Developer ID Application:"*) ;;
            *) echo "::error::Unerwartete Apple-Codeidentität für den internen Trace-Build."; exit 1 ;;
          esac
          certificate="$RUNNER_TEMP/trace-signing.p12"
          keychain="$RUNNER_TEMP/trace-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$certificate"
          security create-keychain -p trace-ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p trace-ci "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign >/dev/null
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k trace-ci "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain" | grep -Fq "$APPLE_SIGNING_IDENTITY"
          echo "TRACE_INTERNAL_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Signierten Trace-App-Bundle bauen und einmalig verschlüsseln
        if: matrix.label == 'macos-arm64' && inputs.trace_bundle_public_key_base64 != ''
        working-directory: trace-src
        shell: bash
        env:
          RECIPIENT_PUBLIC_KEY_BASE64: ${{ inputs.trace_bundle_public_key_base64 }}
          SOURCE_SHA: ${{ inputs.trace_ref }}
        run: |
          set -euo pipefail
          bundle_root="$RUNNER_TEMP/trace-host-macos-arm64-internal"
          dmg="$RUNNER_TEMP/trace-host-macos-arm64-internal.dmg"
          delivery="$RUNNER_TEMP/trace-host-macos-arm64-internal.tar.gz"
          envelope="$RUNNER_TEMP/trace-host-macos-arm64-internal.tar.gz.envelope.json"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          codesign --force --options runtime --timestamp \
            --sign "$TRACE_INTERNAL_SIGNING_IDENTITY" "$bundle_root/Trace Host.app"
          codesign --force --options runtime --timestamp \
            --sign "$TRACE_INTERNAL_SIGNING_IDENTITY" "$bundle_root/Trace einrichten.app"
          signature="$(codesign -dv --verbose=4 "$bundle_root/Trace Host.app" 2>&1)"
          test "$(sed -n 's/^Identifier=//p' <<<"$signature")" = "ai.subunit.trace-host"
          test "$(sed -n 's/^TeamIdentifier=//p' <<<"$signature")" = "Y23NYAZM6M"
          grep -Eq '^Authority=(Apple Development|Developer ID Application):' <<<"$signature"
          codesign --verify --deep --strict --verbose=2 "$bundle_root/Trace Host.app"
          setup_signature="$(codesign -dv --verbose=4 "$bundle_root/Trace einrichten.app" 2>&1)"
          test "$(sed -n 's/^Identifier=//p' <<<"$setup_signature")" = "ai.subunit.trace-setup"
          test "$(sed -n 's/^TeamIdentifier=//p' <<<"$setup_signature")" = "Y23NYAZM6M"
          grep -Eq '^Authority=(Apple Development|Developer ID Application):' <<<"$setup_signature"
          codesign --verify --deep --strict --verbose=2 "$bundle_root/Trace einrichten.app"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$version" \
            '{schema_version:"1.0", source_sha:$source_sha, version:$version, bundle_identifier:"ai.subunit.trace-host", setup_bundle_identifier:"ai.subunit.trace-setup", team_identifier:"Y23NYAZM6M", distribution_policy:"internal-signed-not-notarized", customer_ready:false}' \
            > "$bundle_root/BUILD-EVIDENCE.json"
          hdiutil create -volname "Subunit Trace Host Internal" \
            -srcfolder "$bundle_root" -ov -format UDZO "$dmg" >/dev/null
          codesign --force --sign "$TRACE_INTERNAL_SIGNING_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          tar -czf "$delivery" -C "$RUNNER_TEMP" \
            "$(basename "$bundle_root")" "$(basename "$dmg")"
          node "$GITHUB_WORKSPACE/gate/scripts/encrypt-confidential-log.mjs" \
            "$delivery" "$envelope" "$RECIPIENT_PUBLIC_KEY_BASE64"
          rm -rf "$bundle_root" "$dmg" "$delivery"

      - name: Verschlüsselten internen Trace-Mac-Bundle bereitstellen
        if: matrix.label == 'macos-arm64' && inputs.trace_bundle_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: trace-macos-arm64-internal-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/trace-host-macos-arm64-internal.tar.gz.envelope.json
          if-no-files-found: error
          retention-days: 1

      - name: Ephemere Trace-Signingdaten entfernen
        if: always() && matrix.label == 'macos-arm64' && inputs.trace_bundle_public_key_base64 != ''
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/trace-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/trace-signing.p12" \
            "$RUNNER_TEMP/trace-host-macos-arm64-internal.dmg" \
            "$RUNNER_TEMP/trace-host-macos-arm64-internal.tar.gz"
          rm -rf "$RUNNER_TEMP/trace-host-macos-arm64-internal"

      - name: Verschlüsselte Trace-Windows-Fehlerdiagnostik bereitstellen
        if: failure() && matrix.label == 'windows-x64' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: trace-windows-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/trace-windows-diagnostic.json
          if-no-files-found: error
          retention-days: 1

  native-trace:
    needs: preflight
    if: needs.preflight.result == 'success'
    name: SCAI + Trace nativ kompilieren (${{ matrix.label }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macos-arm64
          - runner: windows-2025
            label: windows-x64
            openssl_triplet: x64-windows-static-md
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Quellcode auschecken (privates Repo, read-only Deploy-Key)
        shell: bash
        env:
          SRC_REF: ${{ needs.preflight.outputs.source_sha }}
          REQUEST_ID: ${{ needs.preflight.outputs.request_id }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/gate/scripts/validate-private-source-ref.sh" "$SRC_REF"
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          key_file="$HOME/.ssh/scai_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"
          git init src
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 -- origin "$SRC_REF"
          git -C src checkout --detach FETCH_HEAD
          ACTUAL_SHA=$(git -C src rev-parse HEAD)
          if printf '%s' "$SRC_REF" | grep -Eq '^[0-9a-f]{40}$' && [ "$ACTUAL_SHA" != "$SRC_REF" ]; then
            echo "::error::Checkout-Drift: erwartet $SRC_REF, erhalten $ACTUAL_SHA"
            exit 1
          fi
          cleanup
          trap - EXIT
          echo "ausgecheckt: $SRC_REF → $ACTUAL_SHA"
          echo "PASS private-checkout-scai (source-sha=$ACTUAL_SHA, request-id=$REQUEST_ID)"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable

      - name: OpenSSL für Trace-SQLCipher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENSSL_TRIPLET: ${{ matrix.openssl_triplet }}
        run: |
          if (-not $env:OPENSSL_TRIPLET) { throw "OpenSSL-vcpkg-Triplet fehlt" }
          vcpkg install "openssl:$env:OPENSSL_TRIPLET"
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$env:OPENSSL_TRIPLET" >> $env:GITHUB_ENV

      - name: Privaten Trace-Kern für Cargo freischalten (read-only)
        shell: bash
        env:
          TRACE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TRACE_DEPLOY_KEY:-}" ]; then
            echo "::error::TRACE_SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TRACE_DEPLOY_KEY" > "$HOME/.ssh/trace_src"
          chmod 600 "$HOME/.ssh/trace_src"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-trace
            HostName github.com
            User git
            IdentityFile ~/.ssh/trace_src
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          git config --global url."git@github-trace:subunit-ai/trace-tauri.git".insteadOf \
            "https://github.com/subunit-ai/trace-tauri.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      # Kein Paket, Tag oder Release: dieses Gate kompiliert exakt die nativen
      # Versandfeatures, damit der private Trace-Pin nicht erst im Release auffällt.
      - name: SCAI mit nativer Trace-/Meet-Engine prüfen
        id: native_cargo_check
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-native-cargo-check-diagnostic.json', runner.temp) || '' }}
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" native-cargo-check cargo check --locked --manifest-path src-tauri/Cargo.toml --features local-meet

      - name: Verschlüsselte native Cargo-Check-Fehlerdiagnostik bereitstellen
        if: failure() && steps.native_cargo_check.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-native-cargo-check-encrypted-diagnostic-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-native-cargo-check-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      # Presence S3: Pipe, Prozess-/Token-Prüfung und der Helfer selbst laufen
      # auf echtem Windows — Pipe-Rundreise mit echter DACL als Test, danach
      # startet das gebaute Programm ohne SCAI und meldet sauber `no_pipe`.
      - name: Agenten-Hook-Helfer auf Windows testen und starten
        id: agent_hook_windows
        if: matrix.label == 'windows-x64' && hashFiles('src/src-tauri/crates/scai-agent-hook/Cargo.toml') != ''
        working-directory: src
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/scai-agent-hook-windows-diagnostic.json', runner.temp) || '' }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" agent-hook-windows-test \
            cargo test --locked --manifest-path src-tauri/Cargo.toml -p scai-agent-hook --all-features
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" agent-hook-windows-build \
            node scripts/agent-hook/stage.mjs --target x86_64-pc-windows-msvc
          helper=src-tauri/binaries/scai-agent-hook-x86_64-pc-windows-msvc.exe
          "$helper" --version | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          set +e
          ping=$("$helper" --ping)
          code=$?
          set -e
          if [ "$code" != "1" ] || [ "$ping" != "no_pipe" ]; then
            echo "::error::scai-agent-hook --ping ohne SCAI meldete nicht no_pipe"
            exit 1
          fi
          echo "PASS agent-hook windows-x64 (Test, Bau, Start ohne SCAI)"

      - name: Verschlüsselte Agenten-Hook-Windows-Fehlerdiagnostik bereitstellen
        if: failure() && steps.agent_hook_windows.outcome == 'failure' && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-agent-hook-windows-encrypted-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scai-agent-hook-windows-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      # Ein zusätzlicher src/bin-Helfer darf nie wieder als Tauri-Produkt im
      # Installer landen. Cargo-Metadata muss exakt subunit-scai aus main.rs zeigen.
      - name: Eindeutiges Produkt-Binary beweisen
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" native-product-binary node "$GITHUB_WORKSPACE/gate/scripts/verify-product-binary.mjs" src-tauri/Cargo.toml

      # A1 / Native Auth: Ein Linux-Erfolg reicht nicht als Beweis für den
      # ausgelieferten Desktop-Pfad. Derselbe gepinnte SCAI-Stand muss die
      # PKCE-/State-/Redirect-Bindung auf unseren echten Release-Runners
      # (macOS ARM64 und Windows x64) ausführen, nicht nur kompilieren.
      - name: Native PKCE-Sitzungstests ausführen
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" native-pkce-tests cargo test --locked --manifest-path src-tauri/Cargo.toml --features local-meet auth::tests -- --nocapture

      # Anders als die Unit-Tests nutzt dieses explizite Smoke-Example den
      # echten macOS-Schlüsselbund beziehungsweise Windows Credential Manager.
      # Es bleibt außerhalb der Tauri-Binärziele; der zufällige Canary wird nie
      # ausgegeben und im selben Lauf gelöscht.
      - name: Echten OS-Credential-Store beweisen
        working-directory: src
        env:
          SCAI_A1_KEYRING_SMOKE: "1"
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*a1-keyring-smoke[[:space:]]*=' src-tauri/Cargo.toml; then
            bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" native-keyring-smoke \
              cargo run --locked --manifest-path src-tauri/Cargo.toml \
              --features a1-keyring-smoke --example a1_keyring_smoke
          else
            bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" native-keyring-smoke \
              cargo run --locked --manifest-path src-tauri/Cargo.toml \
              --example a1_keyring_smoke
          fi

      - name: Private Trace-Credentials entfernen
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/trace_src"
          git config --global --unset-all url.git@github-trace:subunit-ai/trace-tauri.git.insteadOf || true
