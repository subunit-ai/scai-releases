# SCAI — PR-Check (tsc + vite + cargo test) für das PRIVATE Quell-Repo.
#
# WARUM hier (im PUBLIC scai-releases) statt im privaten subunit-scai:
# GitHub rechnet Actions-Minuten nach dem Repo ab, in dem der Workflow LÄUFT.
# `subunit-scai` ist privat → dessen Actions hängen an der Org-Billing-Sperre
# (Jobs sterben nach 3s mit 0 Steps). `scai-releases` ist public → KOSTENLOS.
# Der Quellcode wird per read-only Deploy-Key ausgecheckt (Muster build-all.yml).
#
# SICHERHEIT: Trigger ist AUSSCHLIESSLICH workflow_dispatch — Forks können den
# Workflow nicht mit unseren Secrets starten. Nur wer Schreibrechte auf DIESES
# Repo hat, kann ihn auslösen.
#
# AUSGELÖST VON: scripts/session/ship.sh im Quell-Repo (vor dem Squash-Merge).
#   gh workflow run pr-check.yml -R subunit-ai/scai-releases -f ref=session/<slug>
# ship.sh wartet auf die Conclusion dieses Runs und merged nur bei grün.

name: PR Check (Quell-Repo)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/SHA im privaten Quell-Repo (z.B. session/halo-p1-agent)"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: pr-check-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tsc + vite + cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      # Klon über Git Bash statt actions/checkout+ssh-key (siehe build-all.yml).
      # Ref + Key über env, nicht inline → Injection-sicher.
      - name: Quellcode auschecken (privates Repo, read-only Deploy-Key)
        shell: bash
        env:
          SRC_REF: ${{ inputs.ref }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          key_file="$HOME/.ssh/scai_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"
          git init src
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 origin "$SRC_REF"
          git -C src checkout --detach FETCH_HEAD
          ACTUAL_SHA=$(git -C src rev-parse HEAD)
          if printf '%s' "$SRC_REF" | grep -Eq '^[0-9a-f]{40}$' && [ "$ACTUAL_SHA" != "$SRC_REF" ]; then
            echo "::error::Checkout-Drift: erwartet $SRC_REF, erhalten $ACTUAL_SHA"
            exit 1
          fi
          cleanup
          trap - EXIT
          echo "ausgecheckt: $SRC_REF → $ACTUAL_SHA"

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" npm-ci npm ci

      # Vendored subunit-CLI muss mit Manifest/Signing-Key/Bundle-Wiring synchron
      # bleiben — schlägt bei veraltetem/handgepatchtem Vendor fehl.
      - name: CLI-Drift-Wächter
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" cli-drift npm run drift-guard

      # Release-Meta: EINE Version in allen 5 Dateien + Changelog-Eintrag für sie.
      # Ohne den Eintrag bleibt das „Was ist neu"-Popup nach dem Update leer (genau
      # das passierte bei v0.16.0). Beim Lesen des Diffs sieht man das nicht — die
      # Maschine schon.
      - name: Release-Meta-Wächter
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" release-meta npm run check:release-meta

      # Jedes Plugin muss als eigenständiges Bundle bauen. Der App-Build (vite) deckt
      # das NICHT ab: die Plugin-Bundles laufen durch esbuild mit anderen Defines.
      # Gemessen: eine neue `import.meta.env.PROD`-Nutzung in lib/config.ts ließ den
      # chat-Bau scheitern — bemerkt erst beim Publish, und der ganze Release-Zug stand.
      - name: Plugin-Bundles bauen (Probe)
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" plugin-bundles npm run check:plugins

      # SCAI wurde als Demo gebaut und wird als Enterprise-Produkt verkauft. Seeds
      # ("Max Mustermann"), echte Kundennamen und Attrappen-Antworten dürfen nicht wieder
      # einsickern. Der Wächter hängt bewusst HIER und nicht nur im Quell-Repo: dessen
      # Actions sind billing-gesperrt (jeder Lauf stirbt nach ~4 s mit 0 Steps), der Step
      # dort läuft also nie. Diese Pipeline ist die einzige, die wirklich prüft.
      - name: Keine Demo-Daten im Produktcode
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" no-demo-data npm run check:no-demo-data

      - name: Bauen (tsc + vite)
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" frontend-build npm run build

      - name: Chromium für Meet-Seh-Harness
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" playwright-install npx playwright install --with-deps chromium

      - name: Meet-Plugin visuell und interaktiv beweisen
        working-directory: src
        env:
          PROOF_RUN_ID: ci
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" meet-visual-proof node scripts/verify-meet-plugin.mjs

      - name: Meet-Proof-Screenshots sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: scai-meet-proof-${{ github.run_id }}
          path: ~/.cache/u1-shots/scai-meet-plugin/ci/
          if-no-files-found: warn
          retention-days: 14

      # Rust-Kompilat + Unit-Tests. Tauri v2 linkt webkit2gtk/gtk auch für
      # `cargo test` → Systembibliotheken nötig.
      - name: Tauri-Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable

      # Der read-only Trace-Key wird erst nach allen Third-Party-Actions
      # bereitgestellt und nach dem privaten Cargo-Aufruf wieder entfernt.
      - name: Privaten Trace-Kern für Cargo freischalten (read-only)
        shell: bash
        env:
          TRACE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TRACE_DEPLOY_KEY:-}" ]; then
            echo "::error::TRACE_SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TRACE_DEPLOY_KEY" > "$HOME/.ssh/trace_src"
          chmod 600 "$HOME/.ssh/trace_src"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-trace
            HostName github.com
            User git
            IdentityFile ~/.ssh/trace_src
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          git config --global url."git@github-trace:subunit-ai/trace-tauri.git".insteadOf \
            "https://github.com/subunit-ai/trace-tauri.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: cargo test (Sidecar-Trust-Modell + halo + verify-Suite)
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" cargo-test cargo test --manifest-path src-tauri/Cargo.toml --lib --features local-meet

      - name: Private Trace-Credentials entfernen
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/trace_src"
          git config --global --unset-all url.git@github-trace:subunit-ai/trace-tauri.git.insteadOf || true

  native-trace:
    name: SCAI + Trace nativ kompilieren (${{ matrix.label }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macos-arm64
          - runner: windows-2025
            label: windows-x64
            openssl_triplet: x64-windows-static-md
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Quellcode auschecken (privates Repo, read-only Deploy-Key)
        shell: bash
        env:
          SRC_REF: ${{ inputs.ref }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          key_file="$HOME/.ssh/scai_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"
          git init src
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 origin "$SRC_REF"
          git -C src checkout --detach FETCH_HEAD
          ACTUAL_SHA=$(git -C src rev-parse HEAD)
          if printf '%s' "$SRC_REF" | grep -Eq '^[0-9a-f]{40}$' && [ "$ACTUAL_SHA" != "$SRC_REF" ]; then
            echo "::error::Checkout-Drift: erwartet $SRC_REF, erhalten $ACTUAL_SHA"
            exit 1
          fi
          cleanup
          trap - EXIT
          echo "ausgecheckt: $SRC_REF → $ACTUAL_SHA"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable

      - name: OpenSSL für Trace-SQLCipher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENSSL_TRIPLET: ${{ matrix.openssl_triplet }}
        run: |
          if (-not $env:OPENSSL_TRIPLET) { throw "OpenSSL-vcpkg-Triplet fehlt" }
          vcpkg install "openssl:$env:OPENSSL_TRIPLET"
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$env:OPENSSL_TRIPLET" >> $env:GITHUB_ENV

      - name: Privaten Trace-Kern für Cargo freischalten (read-only)
        shell: bash
        env:
          TRACE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TRACE_DEPLOY_KEY:-}" ]; then
            echo "::error::TRACE_SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TRACE_DEPLOY_KEY" > "$HOME/.ssh/trace_src"
          chmod 600 "$HOME/.ssh/trace_src"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-trace
            HostName github.com
            User git
            IdentityFile ~/.ssh/trace_src
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          git config --global url."git@github-trace:subunit-ai/trace-tauri.git".insteadOf \
            "https://github.com/subunit-ai/trace-tauri.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      # Kein Paket, Tag oder Release: dieses Gate kompiliert exakt die nativen
      # Versandfeatures, damit der private Trace-Pin nicht erst im Release auffällt.
      - name: SCAI mit nativer Trace-/Meet-Engine prüfen
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" native-cargo-check cargo check --locked --manifest-path src-tauri/Cargo.toml --features local-meet

      # A1 / Native Auth: Ein Linux-Erfolg reicht nicht als Beweis für den
      # ausgelieferten Desktop-Pfad. Derselbe gepinnte SCAI-Stand muss die
      # PKCE-/State-/Redirect-Bindung auf unseren echten Release-Runners
      # (macOS ARM64 und Windows x64) ausführen, nicht nur kompilieren.
      - name: Native PKCE-Sitzungstests ausführen
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" native-pkce-tests cargo test --locked --manifest-path src-tauri/Cargo.toml --features local-meet auth::tests -- --nocapture

      # Anders als die Unit-Tests nutzt diese explizite Smoke-Binärdatei den
      # echten macOS-Schlüsselbund beziehungsweise Windows Credential Manager.
      # Der zufällige Canary wird nie ausgegeben und im selben Lauf gelöscht.
      - name: Echten OS-Credential-Store beweisen
        working-directory: src
        env:
          SCAI_A1_KEYRING_SMOKE: "1"
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" native-keyring-smoke cargo run --locked --manifest-path src-tauri/Cargo.toml --bin a1_keyring_smoke

      - name: Private Trace-Credentials entfernen
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/trace_src"
          git config --global --unset-all url.git@github-trace:subunit-ai/trace-tauri.git.insteadOf || true
