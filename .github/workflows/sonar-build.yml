# Sonar vertraulich bauen; öffentlich verlassen ausschließlich fertige Installer den Runner.
name: Sonar Release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Vollständiger sonar-tauri-Commit-SHA"
        required: true
        type: string
      tag:
        description: "Stabiler Release-Tag vX.Y.Z"
        required: true
        type: string
      diagnostic_public_key_base64:
        description: "Optionaler einmaliger RSA-3072+-Public-Key (PEM, base64)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sonar-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      tag: ${{ steps.request.outputs.tag }}
      bridge_sha: ${{ steps.source.outputs.bridge_sha }}
      bridge_tag: ${{ steps.source.outputs.bridge_tag }}
      trace_sha: ${{ steps.source.outputs.trace_sha }}
      trace_tag: ${{ steps.source.outputs.trace_tag }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Öffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: gate
          persist-credentials: false
      - name: Auftrag ohne private Schlüssel validieren
        id: request
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DIAGNOSTIC_KEY: ${{ inputs.diagnostic_public_key_base64 }}
        run: bash gate/scripts/run-confidential.sh sonar-request node gate/scripts/sonar-release.mjs request
      - name: Sonar exakt und read-only auschecken
        shell: bash
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SONAR_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: bash gate/scripts/run-confidential.sh sonar-checkout bash gate/scripts/checkout-private-source.sh sonar-tauri git@github.com:subunit-ai/sonar-tauri.git "$SOURCE_SHA"
      - name: Source-Version und Komponenten-Pins prüfen
        id: source
        shell: bash
        run: bash gate/scripts/run-confidential.sh sonar-source node gate/scripts/sonar-release.mjs source private/sonar-tauri
      - name: Temporäre Quellen entfernen
        if: always()
        shell: bash
        run: bash gate/scripts/run-confidential.sh sonar-cleanup bash gate/scripts/sonar-build.sh cleanup
      - name: App-Token ausschließlich für Sonar-Distribution
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SUBUNIT_APP_ID }}
          private-key: ${{ secrets.SUBUNIT_APP_PRIVATE_KEY }}
          owner: subunit-ai
          repositories: sonar-releases
          permission-contents: read
      - name: Monotonie und unveränderte Release-Namen prüfen
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash gate/scripts/run-confidential.sh sonar-preflight node gate/scripts/sonar-release.mjs check-remote
  build:
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
    steps:
      - name: Öffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: gate
          persist-credentials: false
      - name: Bun einrichten (vor privatem Checkout)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Rust einrichten (vor privatem Checkout)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Rust-Target installieren
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          TARGET: ${{ matrix.target }}
        run: bash gate/scripts/run-confidential.sh sonar-rust-target bash gate/scripts/sonar-build.sh rust-target "$TARGET"
      - name: Linux-Systemabhängigkeiten installieren
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
        run: bash gate/scripts/run-confidential.sh sonar-linux-deps bash gate/scripts/sonar-build.sh linux-deps
      - name: Sonar exakt und read-only auschecken
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SONAR_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: bash gate/scripts/run-confidential.sh sonar-checkout bash gate/scripts/checkout-private-source.sh sonar-tauri git@github.com:subunit-ai/sonar-tauri.git "$SOURCE_SHA"
      - name: Bridge exakt auschecken und Tag-Drift sperren
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          SOURCE_DEPLOY_KEY: ${{ secrets.BRIDGE_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ needs.preflight.outputs.bridge_sha }}
          COMPONENT_TAG: ${{ needs.preflight.outputs.bridge_tag }}
        run: bash gate/scripts/run-confidential.sh bridge-checkout bash gate/scripts/checkout-private-source.sh bridge-tauri git@github.com:subunit-ai/bridge-tauri.git "$SOURCE_SHA" "$COMPONENT_TAG"
      - name: Trace exakt auschecken und Tag-Drift sperren
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          SOURCE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ needs.preflight.outputs.trace_sha }}
          COMPONENT_TAG: ${{ needs.preflight.outputs.trace_tag }}
        run: bash gate/scripts/run-confidential.sh trace-checkout bash gate/scripts/checkout-private-source.sh trace-tauri git@github.com:subunit-ai/trace-tauri.git "$SOURCE_SHA" "$COMPONENT_TAG"
      - name: Lokale Cargo-Pfadabhängigkeit bereitstellen
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
        run: bash gate/scripts/run-confidential.sh sonar-layout bash gate/scripts/sonar-build.sh layout
      - name: Bridge-Sidecar ausschließlich lokal bauen
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          TARGET: ${{ matrix.target }}
        run: bash gate/scripts/run-confidential.sh sonar-bridge bash gate/scripts/sonar-build.sh bridge "$TARGET"
      - name: Forge-Control nativ pro Target bauen
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          TARGET: ${{ matrix.target }}
          CARGO_NET_RETRY: "5"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: bash gate/scripts/run-confidential.sh sonar-forge bash gate/scripts/sonar-build.sh forge "$TARGET"
      - name: Frontend-Abhängigkeiten installieren
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
        run: bash gate/scripts/run-confidential.sh sonar-frontend bash gate/scripts/sonar-build.sh frontend
      - name: macOS-Identität importieren und self-signed Zertifikat vertrauen
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash gate/scripts/run-confidential.sh sonar-mac-sign bash gate/scripts/sonar-build.sh mac-sign
      - name: Windows-Authenticode optional vorbereiten
        if: startsWith(matrix.os, 'windows')
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bash gate/scripts/run-confidential.sh sonar-windows-sign bash gate/scripts/sonar-build.sh windows-sign
      - name: Tauri-Bundles und Updater-Signaturen bauen
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SONAR_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SONAR_SENTRY_DSN: ${{ secrets.SONAR_SENTRY_DSN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: bash gate/scripts/run-confidential.sh sonar-tauri bash gate/scripts/sonar-build.sh tauri "$TARGET"
      - name: Ausschließlich fertige Installer einsammeln
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          TARGET: ${{ matrix.target }}
        run: bash gate/scripts/run-confidential.sh sonar-collect node gate/scripts/sonar-release.mjs collect private/sonar-tauri "$RUNNER_TEMP/sonar-installers" "$TARGET"
      - name: Temporäre Quellen und Keychain entfernen
        if: always()
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
        run: bash gate/scripts/run-confidential.sh sonar-cleanup bash gate/scripts/sonar-build.sh cleanup
      - name: Fertige Installer für den Publish-Job übergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-installers-${{ matrix.target }}
          path: ${{ runner.temp }}/sonar-installers/
          if-no-files-found: error
          retention-days: 1
      - name: Ausschließlich verschlüsselte Fehlerdiagnose bereitstellen
        if: failure() && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-encrypted-diagnostic-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-diagnostic*.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      SCAI_ENCRYPTED_DIAGNOSTIC_PUBLIC_KEY_BASE64: ${{ inputs.diagnostic_public_key_base64 }}
    steps:
      - name: Öffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: gate
          persist-credentials: false
      - name: Fertige Installer laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sonar-installers-*
          merge-multiple: true
          path: ${{ runner.temp }}/sonar-installers
      - name: Gebundenen Updater-Public-Key read-only laden
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SONAR_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: bash gate/scripts/run-confidential.sh sonar-checkout bash gate/scripts/checkout-private-source.sh sonar-tauri git@github.com:subunit-ai/sonar-tauri.git "$SOURCE_SHA"
      - name: Gepinnten Minisign-Verifizierer installieren
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
        run: bash gate/scripts/run-confidential.sh sonar-minisign bash gate/scripts/sonar-minisign.sh
      - name: Alle fünf Signaturen prüfen und Tauri-v2-Feed erzeugen
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          MINISIGN_BIN: ${{ runner.temp }}/minisign-linux/x86_64/minisign
        run: bash gate/scripts/run-confidential.sh sonar-manifest node gate/scripts/sonar-release.mjs prepare private/sonar-tauri "$RUNNER_TEMP/sonar-installers"
      - name: Temporäre Quellen entfernen
        if: always()
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
        run: bash gate/scripts/run-confidential.sh sonar-cleanup bash gate/scripts/sonar-build.sh cleanup
      - name: App-Token ausschließlich für Sonar-Distribution
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SUBUNIT_APP_ID }}
          private-key: ${{ secrets.SUBUNIT_APP_PRIVATE_KEY }}
          owner: subunit-ai
          repositories: sonar-releases
          permission-contents: write
      - name: Neuen Draft anlegen, Assets prüfen und erst dann Latest veröffentlichen
        shell: bash
        env:
          SCAI_ENCRYPTED_DIAGNOSTIC_PATH: ${{ inputs.diagnostic_public_key_base64 != '' && format('{0}/sonar-diagnostic.json', runner.temp) || '' }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash gate/scripts/run-confidential.sh sonar-publish node gate/scripts/sonar-release.mjs publish "$RUNNER_TEMP/sonar-installers"
      - name: Ausschließlich verschlüsselte Fehlerdiagnose bereitstellen
        if: failure() && inputs.diagnostic_public_key_base64 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-encrypted-diagnostic-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-diagnostic*.json
          if-no-files-found: error
          retention-days: 1
