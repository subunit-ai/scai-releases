# u1-chat — SHA-gebundener PR-Check fuer das PRIVATE Quell-Repo.
#
# Das private u1-chat-Repo kann wegen der Org-Billing-Sperre keine eigenen Jobs
# starten. Dieser ausschliesslich manuell ausloesbare Public-Runner checkt genau
# einen vollstaendigen Commit-SHA per read-only Deploy-Key aus. Quellcode bleibt
# in einem fluechtigen private/-Ordner und wird nie veroeffentlicht. Spiegelt den
# u1-chat-Job aus fleet-source-check.yml (release-ID-frei, pro PR).

name: u1-chat PR Check (private source)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Vollstaendiger u1-chat Commit-SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: u1-chat-pr-check-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: u1-chat backend and boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Oeffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false
      - name: Commit-Pin pruefen
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "PASS u1-chat-source-pin (source-sha=$SOURCE_SHA)"
      - name: Gepinntes Bun einrichten
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, immutable
        with:
          bun-version: 1.3.14
      - name: u1-chat exakt und read-only auschecken
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.U1_CHAT_SOURCE_DEPLOY_KEY }}
        run: bash gate/scripts/checkout-private-source.sh u1-chat git@github.com:subunit-ai/u1-chat.git "$SOURCE_SHA"
      - name: Backend- und Boundary-Suite
        working-directory: private/u1-chat
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-chat-tests bun test
      - name: Backend buendeln
        working-directory: private/u1-chat
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-chat-build bun build server.ts --target bun --outdir "$RUNNER_TEMP/u1chat-ci-build"
      - name: Deployment-Gate syntaktisch pruefen
        working-directory: private/u1-chat
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-chat-deploy-gate bash -n scripts/deploy.sh
      - name: Anchor-Authority installieren und pruefen
        working-directory: private/u1-chat/anchor-authority
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-anchor-install bun install --frozen-lockfile
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-anchor-tests bun test
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-anchor-deploy-dry bun run deploy:dry
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-anchor-migrate-local bun run migrate:local
      - name: Temporaeren privaten Checkout entfernen
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private/u1-chat"
