# Releasebezogenes Remote-CI für die privaten SCAI-Fleet-Komponenten.
# Kein generischer Public-CI-Pool: Jeder Lauf ist manuell, release-ID-gebunden
# und checkt ausschließlich vollständige, explizite Kandidaten-SHAs aus.

name: Fleet Source Check (private Repos)

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Fleet Release-ID"
        required: true
        type: string
      u1_chat_sha:
        description: "Vollständiger u1-chat Kandidaten-SHA"
        required: true
        type: string
      atlas_sha:
        description: "Vollständiger Atlas Kandidaten-SHA"
        required: true
        type: string
      auth_sha:
        description: "Vollständiger subunit-auth Kandidaten-SHA"
        required: true
        type: string
      echo_sha:
        description: "Vollständiger Echo-Server Kandidaten-SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fleet-source-${{ inputs.release_id }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release-ID und immutable Pins prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      U1_CHAT_SHA: ${{ inputs.u1_chat_sha }}
      ATLAS_SHA: ${{ inputs.atlas_sha }}
      AUTH_SHA: ${{ inputs.auth_sha }}
      ECHO_SHA: ${{ inputs.echo_sha }}
    steps:
      - name: Eingaben fail-closed prüfen
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_ID" | grep -Eq '^[A-Za-z0-9._-]{1,80}$'
          for source_sha in "$U1_CHAT_SHA" "$ATLAS_SHA" "$AUTH_SHA" "$ECHO_SHA"; do
            printf '%s' "$source_sha" | grep -Eq '^[0-9a-f]{40}$'
          done
          echo "PASS fleet-inputs (release-id=$RELEASE_ID)"

  u1-chat:
    name: u1-chat · A5/A7 boundaries
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Öffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Gepinntes Bun einrichten
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, immutable
        with:
          bun-version: 1.3.14

      - name: u1-chat exakt und read-only auschecken
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.U1_CHAT_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ inputs.u1_chat_sha }}
        run: bash gate/scripts/checkout-private-source.sh u1-chat git@github.com:subunit-ai/u1-chat.git "$SOURCE_SHA"

      - name: Backend- und Boundary-Suite
        working-directory: private/u1-chat
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-chat-tests bun test

      - name: Backend bündeln
        working-directory: private/u1-chat
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-chat-build bun build server.ts --target bun --outdir "$RUNNER_TEMP/u1chat-ci-build"

      - name: Deployment-Gate syntaktisch prüfen
        working-directory: private/u1-chat
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-chat-deploy-gate bash -n scripts/deploy.sh

      - name: Anchor-Authority installieren und prüfen
        working-directory: private/u1-chat/anchor-authority
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-anchor-install bun install --frozen-lockfile
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-anchor-tests bun test
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-anchor-deploy-dry bun run deploy:dry
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" u1-anchor-migrate-local bun run migrate:local

      - name: Temporären privaten Checkout entfernen
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private/u1-chat"

  atlas:
    name: Atlas · A6 trust and clearance
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da # pg15, immutable manifest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/atlas_ci
      JOBQUEUE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/atlas_ci
      PROVENANCE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/atlas_ci
      PROVENANCE_HMAC_KEY_ID: ci-key
      PROVENANCE_HMAC_SECRET: ci-only-provenance-hmac-material-at-least-32-bytes
      PROVENANCE_HMAC_PREVIOUS_KEYS: "{}"
      WORKSPACE_HMAC_SECRET: ci-only-workspace-hmac-material
      MEMORY_BACKEND: pgvector
      PGVECTOR_URL: postgresql://postgres:postgres@127.0.0.1:5432/memory_ci
      PGVECTOR_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/memory_ci
      ATLAS_SOURCE_SHA: ${{ inputs.atlas_sha }}
    steps:
      - name: Öffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Gepinntes Bun einrichten
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, immutable
        with:
          bun-version: 1.3.14

      - name: Gepinntes Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, immutable
        with:
          python-version: "3.11"

      - name: PostgreSQL- und Dokument-Proof-Runtimes vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client poppler-utils tesseract-ocr \
            tesseract-ocr-deu tesseract-ocr-eng fonts-dejavu-core fonts-ipafont-gothic
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE memory_ci'

      - name: Atlas exakt und read-only auschecken
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.ATLAS_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ inputs.atlas_sha }}
        run: bash gate/scripts/checkout-private-source.sh atlas git@github.com:subunit-ai/atlas.git "$SOURCE_SHA"

      - name: Web installieren, prüfen und bauen
        working-directory: private/atlas/atlas-web
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-web-install npm ci
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-web-audit npm audit --audit-level=high
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-web-tests bun run test
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-web-build npm run build

      - name: API installieren und Security-/Type-Gates prüfen
        working-directory: private/atlas/atlas-api
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-api-install bun install --frozen-lockfile
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-api-dependency-security bun run security:dependencies
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-api-typecheck bun run typecheck

      - name: Migrationen und isolierte PostgreSQL-Suite
        working-directory: private/atlas/atlas-api
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-api-migrations bash -c 'bun run migrate && bun run migrate'
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-api-tests bun test --isolate

      - name: Restore-, Trust- und Dirty-Document-Proofs
        working-directory: private/atlas/atlas-api
        env:
          ATLAS_RESTORE_DRILL_HMAC_SECRET: ci-only-restore-evidence-hmac-material-at-least-32-bytes
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-restore-proof bash -c 'bun run proof:restore-tamper --out "$RUNNER_TEMP/atlas-restore-tamper" && bun run proof:restore-tamper --verify "$RUNNER_TEMP/atlas-restore-tamper"'
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-trust-proof bash -c 'bun run scripts/trust-eval/cli.ts validate && bun run scripts/trust-eval/cli.ts self-test --out "$RUNNER_TEMP/atlas-trust-selftest" && bun run scripts/trust-eval/cli.ts offline --out "$RUNNER_TEMP/atlas-trust-offline"'
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-dirty-doc-proof bash -c 'bun run scripts/dirty-doc-eval/cli.ts validate && bun run scripts/dirty-doc-eval/cli.ts self-test --out "$RUNNER_TEMP/atlas-dirty-selftest" && bun run scripts/dirty-doc-eval/cli.ts product --out "$RUNNER_TEMP/atlas-dirty-product"'

      - name: API, Worker und commitgebundenes Manifest bauen
        working-directory: private/atlas/atlas-api
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-api-build bun build src/server.ts src/worker.ts --target bun --outdir "$RUNNER_TEMP/atlas-build"
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-release-manifest env GITHUB_SHA="$ATLAS_SOURCE_SHA" bun run scripts/release-manifest.ts --server "$RUNNER_TEMP/atlas-build/server.js" --worker "$RUNNER_TEMP/atlas-build/worker.js" --out "$RUNNER_TEMP/atlas-build/atlas-release.json"

      - name: Memory-Agent installieren und mit pgvector prüfen
        working-directory: private/atlas/services/memory-agent
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-memory-install python -m pip install -r requirements-test.txt
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" atlas-memory-tests python -m pytest -q

      - name: Temporären privaten Checkout entfernen
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private/atlas"

  subunit-auth:
    name: subunit-auth · A7 consent and DSAR
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://release-gate:release-gate@127.0.0.1:9/release-gate
      RESEND_API_KEY: release-gate-no-network
    steps:
      - name: Öffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Gepinntes Bun einrichten
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, immutable
        with:
          bun-version: 1.3.14

      - name: Ephemere JWT-Testschlüssel erzeugen
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/jwt-private.pem" >/dev/null 2>&1
          openssl rsa -pubout -in "$RUNNER_TEMP/jwt-private.pem" \
            -out "$RUNNER_TEMP/jwt-public.pem" >/dev/null 2>&1
          echo "JWT_PRIVATE_KEY_PATH=$RUNNER_TEMP/jwt-private.pem" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=$RUNNER_TEMP/jwt-public.pem" >> "$GITHUB_ENV"

      - name: subunit-auth exakt und read-only auschecken
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.AUTH_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ inputs.auth_sha }}
        run: bash gate/scripts/checkout-private-source.sh subunit-auth git@github.com:subunit-ai/subunit-auth.git "$SOURCE_SHA"

      - name: Abhängigkeiten installieren
        working-directory: private/subunit-auth
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" auth-install bun install --frozen-lockfile

      - name: Auth-/Privacy-Suite und Bundle
        working-directory: private/subunit-auth
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" auth-tests bun test
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" auth-build bun build src/server.ts --target bun --outdir "$RUNNER_TEMP/subunit-auth-build"
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" auth-deploy-gate bash -n scripts/deploy.sh

      - name: Temporären privaten Checkout entfernen
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private/subunit-auth"

      - name: Ephemere JWT-Testschlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/jwt-private.pem" "$RUNNER_TEMP/jwt-public.pem"

  echo:
    name: Echo · A7 consent and retention
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Öffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      - name: Gepinntes Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, immutable
        with:
          python-version: "3.12"

      - name: Echo exakt und read-only auschecken
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.ECHO_SOURCE_DEPLOY_KEY }}
          SOURCE_SHA: ${{ inputs.echo_sha }}
        run: bash gate/scripts/checkout-private-source.sh echo git@github.com:subunit-ai/echo.git "$SOURCE_SHA"

      - name: Testabhängigkeiten installieren
        working-directory: private/echo
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-install python -m pip install numpy==1.26.4 cryptography==42.0.5

      - name: Server-Suite, Compile- und Deployment-Gate
        working-directory: private/echo
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-tests python -m unittest discover -s server/tests -p 'test_*.py' -v
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-compile python -m compileall -q server
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" echo-deploy-gate bash -n scripts/deploy.sh

      - name: Temporären privaten Checkout entfernen
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private/echo"
