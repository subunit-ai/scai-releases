# SCAI — Build & Release für ALLE Plattformen.
#
# WARUM hier (im PUBLIC scai-releases) statt im privaten subunit-scai:
# GitHub rechnet Actions-Minuten nach dem Repo ab, in dem der Workflow LÄUFT.
# `subunit-scai` ist privat → dessen Actions hängen an der Org-Billing-Sperre.
# `scai-releases` ist public → Actions sind hier KOSTENLOS. Der Quellcode wird
# per read-only Deploy-Key ausgecheckt.
#
# SICHERHEIT: Trigger ist AUSSCHLIESSLICH workflow_dispatch (kein pull_request).
# Forks können den Workflow damit nicht mit unseren Secrets ausführen — nur wer
# Schreibrechte auf dieses Repo hat, kann ihn starten.
#
# Ergebnis: EIN DRAFT mit Installern für jede Plattform (dmg/app, nsis-Setup,
# deb/AppImage) + ein vollständiges `latest.json`, das den Tauri-Updater für
# ALLE Plattformen bedient. Veröffentlichung ist ausschließlich Aufgabe von
# `publish-approved.yml`, nachdem das Fleet-Manifest vollständig PASS ist.

name: Build & Release (alle Plattformen)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Menschenlesbarer Quell-Ref für die Release-Evidenz"
        required: true
        default: "main"
      source_sha:
        description: "Unveränderlicher vollständiger SHA im privaten Quell-Repo"
        required: true
      release_id:
        description: "Fleet-Release-ID (scai-candidate-YYYY-MM-DD.N)"
        required: true
      prerelease:
        description: "Draft bei späterer Veröffentlichung als Vorab-Version vormerken"
        type: boolean
        default: false
      distribution_policy:
        description: "Native Signatur-Policy (legacy-v0.125 nur mit bewusster Risikoannahme)"
        type: choice
        options:
          - market-ready
          - legacy-v0.125
        default: market-ready
      compatibility_acknowledgement:
        description: "Für legacy-v0.125 exakt I_ACCEPT_GATEKEEPER_AND_SMARTSCREEN"
        required: false
        default: ""

permissions:
  contents: write # ausschließlich Draft anlegen und Evidence-Assets hochladen
  id-token: write # kurzlebige Sigstore-Identität für GitHub Artifact Attestations
  attestations: write

jobs:
  # RELEASE EINMAL ANLEGEN — vor der Matrix, gegen das Anlege-Rennen.
  #
  # tauri-action legt das Release selbst an, wenn es fehlt: erst `view`, dann `create`.
  # Bei fünf parallelen Matrix-Jobs prüfen alle fünf gleichzeitig „gibt es das schon?",
  # alle fünf sagen nein, einer gewinnt — die anderen sterben an
  #   Validation Failed: {"code":"already_exists","field":"tag_name"}
  # und zwar NACH dem Bauen und Signieren, mit fertigen Artefakten in der Hand.
  # Gemessen bei v0.102.0: macOS (Apple Silicon) fiel so aus, dmg war gebaut und signiert.
  # Wen es trifft, ist reiner Zufall — beim nächsten Mal eine andere Plattform.
  #
  # Verwandt, aber nicht dasselbe: das latest.json-Merge-Race weiter unten (Job `manifest`).
  # Beide Rennen entstehen daraus, dass die Matrix-Jobs sich EIN Release teilen.
  release:
    name: Release anlegen
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.ermitteln.outputs.tag }}
      source_sha: ${{ steps.ermitteln.outputs.source_sha }}
    steps:
      - name: Release-Secret-Preflight
        shell: bash
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          TRACE_SOURCE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_SUBJECT: ${{ secrets.WINDOWS_CERTIFICATE_SUBJECT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DISTRIBUTION_POLICY: ${{ inputs.distribution_policy }}
          COMPATIBILITY_ACKNOWLEDGEMENT: ${{ inputs.compatibility_acknowledgement }}
        run: |
          set -euo pipefail
          BASE_RELEASE_SECRETS=(
            SOURCE_DEPLOY_KEY TRACE_SOURCE_DEPLOY_KEY
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            TAURI_SIGNING_PRIVATE_KEY
          )
          MARKET_READY_SECRETS=(
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE_SUBJECT
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )
          case "$DISTRIBUTION_POLICY" in
            market-ready)
              REQUIRED_RELEASE_SECRETS=("${BASE_RELEASE_SECRETS[@]}" "${MARKET_READY_SECRETS[@]}")
              ;;
            legacy-v0.125)
              if [ "$COMPATIBILITY_ACKNOWLEDGEMENT" != "I_ACCEPT_GATEKEEPER_AND_SMARTSCREEN" ]; then
                echo "::error::legacy-v0.125 verlangt die exakte Gatekeeper-/SmartScreen-Risikoannahme."
                exit 1
              fi
              REQUIRED_RELEASE_SECRETS=("${BASE_RELEASE_SECRETS[@]}")
              ;;
            *)
              echo "::error::Unbekannte Distribution-Policy: $DISTRIBUTION_POLICY"
              exit 1
              ;;
          esac
          MISSING_RELEASE_SECRETS=()
          for secret_name in "${REQUIRED_RELEASE_SECRETS[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              MISSING_RELEASE_SECRETS+=("$secret_name")
            fi
          done
          if [ "${#MISSING_RELEASE_SECRETS[@]}" -ne 0 ]; then
            printf '::error::Fehlendes Release-Secret: %s\n' "${MISSING_RELEASE_SECRETS[@]}"
            exit 1
          fi
          echo "Alle erforderlichen Release-Secrets sind gesetzt; Werte wurden nicht ausgegeben."

      - name: Version aus dem Quell-Repo lesen
        id: ermitteln
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_sha muss ein vollständiger kleingeschriebener 40-Zeichen-Git-SHA sein."
            exit 1
          fi
          key_file="$HOME/.ssh/scai_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"
          git init src
          # Git for Windows defaults to core.autocrlf=true. That rewrites the
          # pinned tree after checkout and made source-contract proofs observe
          # different bytes than macOS/Linux. Exact-SHA builds use repository
          # bytes on every runner; platform packaging handles native formats.
          git -C src config core.autocrlf false
          git -C src config core.eol lf
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 origin "$SOURCE_SHA"
          git -C src checkout --detach FETCH_HEAD
          ACTUAL_SHA=$(git -C src rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checkout-Drift: erwartet $SOURCE_SHA, erhalten $ACTUAL_SHA"
            exit 1
          fi
          cleanup
          trap - EXIT
          # Dieselbe Quelle, aus der tauri-action `v__VERSION__` auflöst.
          VERSION=$(node -p "require('./src/src-tauri/tauri.conf.json').version")
          # Format erzwingen, bevor der Wert in einen Befehl wandert: der String kommt
          # zwar aus unserem eigenen Repo, aber ein Wert, der später ein Argument wird,
          # gehört validiert und nicht geglaubt. Fail-closed statt kreativ.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Unplausible Version in tauri.conf.json: '$VERSION'"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "Version aus tauri.conf.json: v${VERSION}; Source-Pin: ${ACTUAL_SHA}"

      - name: Release sicherstellen (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ermitteln.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ steps.ermitteln.outputs.source_sha }}
          SOURCE_REF: ${{ inputs.ref }}
          RELEASE_ID: ${{ inputs.release_id }}
          DISTRIBUTION_POLICY: ${{ inputs.distribution_policy }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_ID" | grep -Eq '^scai-candidate-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
            echo "::error::Ungültige Fleet-Release-ID: $RELEASE_ID"
            exit 1
          fi
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft)
            BODY=$(gh release view "$TAG" -R "$REPO" --json body --jq .body)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG ist bereits veröffentlicht — Assets werden niemals überschrieben."
              exit 1
            fi
            if ! printf '%s' "$BODY" | grep -Fq "Source-SHA: $SOURCE_SHA"; then
              echo "::error::Draft $TAG gehört nicht zum angeforderten Source-SHA $SOURCE_SHA."
              exit 1
            fi
            if ! printf '%s' "$BODY" | grep -Fq "Fleet-Release-ID: $RELEASE_ID"; then
              echo "::error::Draft $TAG gehört nicht zur angeforderten Fleet-Release-ID $RELEASE_ID."
              exit 1
            fi
            if ! printf '%s' "$BODY" | grep -Fq "Distribution-Policy: $DISTRIBUTION_POLICY"; then
              echo "::error::Draft $TAG gehört nicht zur angeforderten Distribution-Policy $DISTRIBUTION_POLICY."
              exit 1
            fi
            echo "Passender Draft $TAG existiert — sicherer idempotenter Re-Run."
            exit 0
          fi
          FLAGS=()
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          # Kein --verify-tag: der Tag lebt im QUELL-Repo, nicht hier. GitHub legt ihn
          # beim Anlegen auf dem Default-Branch-HEAD dieses Repos an — genau das tut
          # tauri-action auch, wir nehmen ihm nur das Rennen ab.
          gh release create "$TAG" -R "$REPO" \
            --draft \
            --title "SCAI $TAG" \
            --notes "SCAI $TAG — Installer für macOS (Apple Silicon & Intel), Windows (x64 & ARM64) und Linux.

          Source-Ref: $SOURCE_REF
          Source-SHA: $SOURCE_SHA
          Fleet-Release-ID: $RELEASE_ID
          Distribution-Policy: $DISTRIBUTION_POLICY

          Auto-Update ist für alle Plattformen verdrahtet (\`latest.json\`). \`legacy-v0.125\` bedeutet: macOS Apple-Development-signiert, nicht notarisiert; Windows ohne Authenticode. Dieser Workflow veröffentlicht niemals." \
            "${FLAGS[@]}"
          echo "Draft $TAG angelegt — öffentlich wird er erst nach allen Gates."

  build:
    name: ${{ matrix.label }}
    needs: release
    strategy:
      fail-fast: false # eine kaputte Plattform darf die anderen nicht mitreißen
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            meet_features: --features local-meet
            signing_args: ""
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            # ort/onnxruntime publishes no x86_64 macOS prebuilt for this target.
            # The stable IPC remains present and reports built=false; cloud Meet,
            # library, Atlas and legacy-protocol import remain fully available.
            meet_features: ""
            signing_args: ""
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            meet_features: --features local-meet
            openssl_triplet: x64-windows-static-md
            signing_args: --config src-tauri/tauri.windows-signing.json
          - label: Windows (ARM64)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            meet_features: --features local-meet
            openssl_triplet: arm64-windows-static-md
            signing_args: --config src-tauri/tauri.windows-signing.json
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            # ort's current Linux archive references glibc-2.38/C23 symbols,
            # while the compatibility release runner is Ubuntu 22.04/glibc 2.35.
            # Keep the portable package; the local-native gate reports built=false.
            meet_features: ""
            signing_args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Öffentlichen Confidential-Runner auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false

      # Bewusst KEIN actions/checkout mit ssh-key: der windows-11-arm-Runner hat
      # kein funktionierendes C:\Windows\System32\OpenSSH\ssh.exe (Checkout schlug
      # dort mit "Could not read from remote repository" fehl). Ein Klon über Git
      # Bash nutzt das von Git mitgelieferte ssh und läuft auf ALLEN Runnern.
      # Ref + Key kommen über env (nicht inline in run:) — Injection-sicher.
      - name: Quellcode auschecken (privates Repo, read-only Deploy-Key)
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Ungültiger Source-SHA: $SOURCE_SHA"
            exit 1
          fi
          key_file="$HOME/.ssh/scai_src"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes"
          git init src
          git -C src config core.autocrlf false
          git -C src config core.eol lf
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 origin "$SOURCE_SHA"
          git -C src checkout --detach FETCH_HEAD
          ACTUAL_SHA=$(git -C src rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Checkout-Drift: erwartet $SOURCE_SHA, erhalten $ACTUAL_SHA"
            exit 1
          fi
          cleanup
          trap - EXIT
          echo "ausgecheckt: $ACTUAL_SHA"

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable pin
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Rust einrichten (Ziel ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable pin
        with:
          targets: ${{ matrix.target }}

      # whisper.cpp/ggml unterstützt Windows ARM64, lehnt dort aber den
      # MSVC-C-Compiler ab. Rust/Tauri bleiben beim offiziellen MSVC-Target;
      # nur die nativen Meet-Abhängigkeiten laufen über ClangCL + Ninja.
      - name: ClangCL für native ARM64-Meet-Abhängigkeiten aktivieren
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          clang-cl --version
          ninja --version
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CC_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          "CXX_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS_aarch64_pc_windows_msvc=/EHsc" >> $env:GITHUB_ENV

      - name: Linux-Systemabhängigkeiten (WebKit/GTK)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libasound2-dev libssl-dev

      - name: OpenSSL für Trace-SQLCipher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENSSL_TRIPLET: ${{ matrix.openssl_triplet }}
        run: |
          if (-not $env:OPENSSL_TRIPLET) { throw "OpenSSL-vcpkg-Triplet fehlt" }
          vcpkg install "openssl:$env:OPENSSL_TRIPLET"
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$env:OPENSSL_TRIPLET" >> $env:GITHUB_ENV

      - name: Abhängigkeiten installieren
        working-directory: src
        shell: bash
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" release-npm-ci npm ci

      - name: Windows-Code-Signing vorbereiten (OV/EV-Zertifikat + RFC-3161-Zeitstempel)
        if: runner.os == 'Windows' && inputs.distribution_policy == 'market-ready'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_SUBJECT: ${{ secrets.WINDOWS_CERTIFICATE_SUBJECT }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_SUBJECT)) {
            throw "Windows-Code-Signing-Secrets fehlen — kein unsignierter Enterprise-Installer."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "scai-windows-sign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw "Importiertes Windows-Zertifikat hat keinen privaten Schlüssel." }
          if ($cert.Subject -notlike "*$env:WINDOWS_CERTIFICATE_SUBJECT*") {
            throw "Windows-Signer stimmt nicht mit WINDOWS_CERTIFICATE_SUBJECT überein."
          }

          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
                tsp = $true
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "src/src-tauri/tauri.windows-signing.json"
          "WINDOWS_SIGNER_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # macOS-CODESIGNATUR — der Grund, warum erteilte Berechtigungen ein Update überleben.
      #
      # Ohne diesen Schritt signiert Tauri ad-hoc ("-" aus tauri.conf.json). Eine ad-hoc-
      # Signatur hat KEINE Zertifikatskette, also kann codesign die Designated Requirement
      # nur an den nackten Code-Hash binden:  designated => cdhash H"dc76bb05…"
      # Jeder Build erzeugt einen anderen cdhash → für macOS ist das eine ANDERE App →
      # die TCC-Grants (Mikrofon, Bildschirmaufnahme, Bedienungshilfen, Eingabeüberwachung,
      # Ordner) passen nicht mehr und sind nach dem Update wertlos. Der Haken in den
      # Systemeinstellungen bleibt sichtbar stehen, wirkt aber nicht — genau TJs Symptom.
      #
      # Mit einer echten Identität leitet codesign die DR aus dem Zertifikat ab:
      #   designated => identifier "ai.subunit.scai" and certificate leaf = H"…"
      # Bundle-ID und Leaf-Zert sind über alle Builds identisch → die Grants halten.
      # Belegt an echo.app, das exakt so signiert wird und seine Grants behält.
      #
      # Wir importieren das Developer-ID-Zertifikat bewusst einmal selbst und geben
      # tauri-action nur die Identität. Die Apple-Zertifikatskette muss regulär gültig
      # sein; selbstsignierte Roots werden nicht mehr als Release-Pfad akzeptiert.
      - name: macOS-Signatur und Notarisierung vorbereiten (Developer ID)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DISTRIBUTION_POLICY: ${{ inputs.distribution_policy }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY fehlen — kein ad-hoc Release."
            exit 1
          fi
          case "$DISTRIBUTION_POLICY:$APPLE_SIGNING_IDENTITY" in
            market-ready:"Developer ID Application:"*) ;;
            legacy-v0.125:"Apple Development:"*) ;;
            market-ready:*)
              echo "::error::Marktreife macOS-Artefakte brauchen eine Developer-ID-Application-Identität."
              exit 1
              ;;
            legacy-v0.125:*)
              echo "::error::legacy-v0.125 ist ausschließlich mit der vorhandenen Apple-Development-Identität zulässig."
              exit 1
              ;;
          esac
          if [ "$DISTRIBUTION_POLICY" = "market-ready" ] \
            && { [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; }; then
            echo "::error::Notarisierungs-Zugangsdaten fehlen — kein nicht-notarisierter Release."
            exit 1
          fi

          echo "$APPLE_CERTIFICATE" | base64 -d > /tmp/scai-sign.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain # kein Auto-Lock mitten im Build
          security import /tmp/scai-sign.p12 -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k ci build.keychain > /dev/null
          rm /tmp/scai-sign.p12
          echo "gültige Codesigning-Identitäten:"
          security find-identity -v -p codesigning build.keychain

          # Variablen ERST JETZT scharf schalten — bewusst über GITHUB_ENV statt im
          # env-Block des tauri-action-Steps: ein nicht gesetztes GitHub-Secret liefert
          # dort einen LEEREN String, die Variable wäre also trotzdem definiert. Tauri
          # würde dann mit leerer Identität signieren wollen. "Nicht definiert" ist
          # eindeutig, "leer" nicht — deshalb setzen wir sie nur, wenn wirklich was da ist.
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          if [ "$DISTRIBUTION_POLICY" = "market-ready" ]; then
            # Tauri notarisiert automatisch, sobald diese drei Variablen gesetzt sind.
            # Sie sind oben fail-closed geprüft; ein marktreifer Release ohne Notarisierung existiert nicht.
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "legacy-v0.125: Apple-Development-Signatur aktiv, Notarisierung bewusst deaktiviert."
          fi

      - name: Privaten Trace-Kern für Cargo freischalten (read-only)
        shell: bash
        env:
          TRACE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TRACE_DEPLOY_KEY:-}" ]; then
            echo "::error::TRACE_SOURCE_DEPLOY_KEY fehlt."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TRACE_DEPLOY_KEY" > "$HOME/.ssh/trace_src"
          chmod 600 "$HOME/.ssh/trace_src"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-trace
            HostName github.com
            User git
            IdentityFile ~/.ssh/trace_src
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          git config --global url."git@github-trace:subunit-ai/trace-tauri.git".insteadOf \
            "https://github.com/subunit-ai/trace-tauri.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      # Das frühere tauri-action lief direkt im PUBLIC Workflow-Log. Rust-/TS-
      # Warnungen und Fehler konnten dadurch einzelne Zeilen aus dem privaten Repo
      # offenlegen. Der Build läuft jetzt hinter einem Output-Sink; öffentlich
      # bleiben nur Exit-Code, Log-Digest und explizit allowlistete Release-Dateien.
      - name: Bauen · signieren · allowlistete Draft-Assets hochladen
        working-directory: src
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          ENABLE_MEET: ${{ matrix.meet_features != '' }}
          WINDOWS_SIGNING: ${{ matrix.signing_args != '' && inputs.distribution_policy == 'market-ready' }}
          # Updater-Signatur (minisign, derselbe Key wie beim lokalen Mac-Release) —
          # das ist NUR der Update-Mechanismus, nicht die Code-Signatur der App.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_SIGNING_IDENTITY (und ggf. APPLE_ID/_PASSWORD/_TEAM_ID) kommen aus dem
          # Schritt oben über GITHUB_ENV. Hier bewusst NICHT auflisten: ein env-Eintrag
          # im Step überschreibt den GITHUB_ENV-Wert — mit einem leeren String, falls das
          # Secret fehlt. Und APPLE_CERTIFICATE gehört hier ohnehin nie hin (untrusted
          # Re-Import, siehe oben).
        run: |
          set -euo pipefail
          BUILD_ARGS=(--target "$TARGET" --bundles "$BUNDLES")
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            # Tauri fasst den gesamten beforeBuildCommand samt Rust-/Bundlebau in
            # einen einzigen Fehlerstep zusammen. Auf Windows beweisen wir die fünf
            # Frontend-Gates separat und schalten nur den bereits ausgeführten Hook
            # danach aus. So bleibt private Ausgabe unterdrückt, der fehlerhafte
            # Layer aber eindeutig messbar.
            bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" "windows-runtime-$TARGET" \
              npm run check:runtime-capabilities
            bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" "windows-typescript-$TARGET" \
              node ./node_modules/typescript/bin/tsc
            bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" "windows-vite-$TARGET" \
              node --max-old-space-size=4096 ./node_modules/vite/bin/vite.js build
            bash "$GITHUB_WORKSPACE/gate/scripts/run-indexed-confidential.sh" \
              "windows-native-broker-$TARGET" 30 npm run check:native-broker
            bash "$GITHUB_WORKSPACE/gate/scripts/run-indexed-confidential.sh" \
              "windows-plugin-envelope-$TARGET" 14 npm run check:plugin-envelope
            BUILD_ARGS+=(--config '{"build":{"beforeBuildCommand":null}}')
          fi
          if [ "$ENABLE_MEET" = "true" ]; then
            BUILD_ARGS+=(--features local-meet)
          fi
          if [ "$WINDOWS_SIGNING" = "true" ]; then
            BUILD_ARGS+=(--config src-tauri/tauri.windows-signing.json)
          fi

          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" "tauri-build-$TARGET" \
            npm run tauri build -- "${BUILD_ARGS[@]}"

          BUNDLE_ROOT="src-tauri/target/$TARGET/release/bundle"
          case "$TARGET" in
            aarch64-apple-darwin) MAC_ARCHIVE_LABEL=aarch64 ;;
            x86_64-apple-darwin) MAC_ARCHIVE_LABEL=x64 ;;
            *) MAC_ARCHIVE_LABEL="" ;;
          esac
          if [ -n "$MAC_ARCHIVE_LABEL" ]; then
            # Tauri nennt beide Matrix-Archive standardmäßig SCAI.app.tar.gz. Ohne
            # Normalisierung überschreibt der zweite Upload den ersten im gemeinsamen
            # Draft. Die historischen Updater-Namen tragen deshalb die Architektur.
            APP_ARCHIVE=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
            test -n "$APP_ARCHIVE"
            test -f "$APP_ARCHIVE.sig"
            NORMALIZED_ARCHIVE="$BUNDLE_ROOT/macos/SCAI_${MAC_ARCHIVE_LABEL}.app.tar.gz"
            test ! -e "$NORMALIZED_ARCHIVE"
            test ! -e "$NORMALIZED_ARCHIVE.sig"
            mv "$APP_ARCHIVE" "$NORMALIZED_ARCHIVE"
            mv "$APP_ARCHIVE.sig" "$NORMALIZED_ARCHIVE.sig"
          fi
          ASSET_LIST="$RUNNER_TEMP/scai-release-assets-$TARGET.txt"
          bash "$GITHUB_WORKSPACE/gate/scripts/validate-release-assets.sh" \
            "$TARGET" "$BUNDLE_ROOT" > "$ASSET_LIST"
          ASSETS=()
          while IFS= read -r asset; do
            test -n "$asset"
            ASSETS+=("$asset")
          done < "$ASSET_LIST"
          rm -f "$ASSET_LIST"
          test "${#ASSETS[@]}" -gt 0

          gh release upload "$TAG" "${ASSETS[@]}" -R "$REPO" --clobber
          echo "PASS $TARGET: ${#ASSETS[@]} allowlistete Draft-Assets hochgeladen; keine Build-Ausgabe veröffentlicht."

      # BEWEIS STATT BEHAUPTUNG. Der Keychain-Schritt oben kann grün sein und die App
      # trotzdem ad-hoc signiert rauskommen (falsche Identity, Tauri ignoriert die env,
      # Zert nicht vertraut) — und niemand merkt es, weil ein ad-hoc-Build genauso
      # aussieht wie ein signierter. Wir MESSEN das Ergebnis deshalb am gebauten .app:
      #
      #   ad-hoc   → designated => cdhash H"…"        (Hash-Pin, bricht bei JEDEM Update)
      #   signiert → designated => identifier "…" and certificate leaf = H"…"  (stabil)
      #
      # Nur die zweite Form lässt macOS die erteilten TCC-Rechte über ein Update hinweg
      # wiedererkennen. Ist sie nicht da, ist der Release wertlos — also Abbruch.
      - name: Signatur am gebauten .app VERIFIZIEREN (nicht glauben — messen)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          DISTRIBUTION_POLICY: ${{ inputs.distribution_policy }}
        run: |
          set -euo pipefail
          APP=$(find "src/src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Kein .app-Bundle gefunden — Verifikation unmöglich."
            exit 1
          fi
          echo "Prüfe: $APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/sig.txt
          echo "── Designated Requirement ──"
          codesign -d --requirements - "$APP" 2>&1 | tee /tmp/dr.txt

          if grep -q "Signature=adhoc" /tmp/sig.txt; then
            echo "::error::Das ausgelieferte .app ist AD-HOC signiert. Alle Kunden-Berechtigungen würden beim Update sterben."
            exit 1
          fi
          if grep -q "cdhash" /tmp/dr.txt && ! grep -q "certificate leaf" /tmp/dr.txt; then
            echo "::error::Designated Requirement ist ein cdhash-Pin statt zertifikatsbasiert — Berechtigungen überleben kein Update."
            exit 1
          fi
          if ! grep -q "certificate leaf\|anchor apple generic" /tmp/dr.txt; then
            echo "::error::Designated Requirement enthält keine Zertifikats-Bindung."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          DMG=$(find "src/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::Kein DMG für Signatur-Evidenz gefunden."
            exit 1
          fi
          SIGNER=$(sed -n 's/^Authority=//p' /tmp/sig.txt | head -1)
          if [ -z "$SIGNER" ]; then
            echo "::error::Code-Signer konnte nicht ausgelesen werden."
            exit 1
          fi
          GATEKEEPER_VERIFIED=false
          NOTARIZATION_VERIFIED=false
          if [ "$DISTRIBUTION_POLICY" = "market-ready" ]; then
            case "$SIGNER" in "Developer ID Application:"*) ;; *) echo "::error::Unerwarteter marktreifer Signer: $SIGNER"; exit 1;; esac
            spctl --assess --type execute --verbose=4 "$APP"
            xcrun stapler validate "$DMG"
            GATEKEEPER_VERIFIED=true
            NOTARIZATION_VERIFIED=true
          else
            case "$SIGNER" in "Apple Development:"*) ;; *) echo "::error::Unerwarteter legacy-v0.125-Signer: $SIGNER"; exit 1;; esac
            echo "legacy-v0.125: Gatekeeper-/Notarisierungsprüfung bewusst nicht als PASS behauptet."
          fi
          EVIDENCE="$RUNNER_TEMP/signing-evidence-$TARGET.json"
          python3 - "$EVIDENCE" "$TARGET" "$SIGNER" "$APP" "$DMG" "$DISTRIBUTION_POLICY" "$GATEKEEPER_VERIFIED" "$NOTARIZATION_VERIFIED" <<'PY'
          import hashlib, json, os, sys
          output, target, signer, app, dmg, policy, gatekeeper, notarization = sys.argv[1:]
          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()
          json.dump({
              "schema_version": "1.0",
              "platform": target,
              "status": "pass",
              "distribution_policy": policy,
              "signer": signer,
              "app_path": os.path.basename(app),
              "dmg": os.path.basename(dmg),
              "dmg_sha256": sha256(dmg),
              "codesign_verified": True,
              "gatekeeper_verified": gatekeeper == "true",
              "notarization_staple_verified": notarization == "true",
          }, open(output, "w"), indent=2)
          PY
          echo "OK — native macOS-Signatur entspricht $DISTRIBUTION_POLICY."

      - name: Windows-Authenticode-Signatur und Zeitstempel VERIFIZIEREN
        if: runner.os == 'Windows' && inputs.distribution_policy == 'market-ready'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseRoot = "src/src-tauri/target/$env:TARGET/release"
          $files = @(
            Get-ChildItem -Path $releaseRoot -Filter "*.exe" -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path "$releaseRoot/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          ) | Sort-Object FullName -Unique
          if ($files.Count -lt 2) { throw "Anwendung und NSIS-Installer wurden nicht beide gefunden." }

          $evidence = @()
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne "Valid") { throw "Ungültige Authenticode-Signatur: $($file.Name) / $($signature.Status)" }
            if ($null -eq $signature.TimeStamperCertificate) { throw "RFC-3161-Zeitstempel fehlt: $($file.Name)" }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_SIGNER_THUMBPRINT) {
              throw "Signer-Drift bei $($file.Name)"
            }
            $evidence += @{
              file = $file.Name
              sha256 = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
              signer = $signature.SignerCertificate.Subject
              signer_thumbprint = $signature.SignerCertificate.Thumbprint
              timestamp_signer = $signature.TimeStamperCertificate.Subject
              status = "pass"
            }
          }
          @{
            schema_version = "1.0"
            platform = $env:TARGET
            status = "pass"
            distribution_policy = "market-ready"
            authenticode_verified = $true
            timestamp_verified = $true
            files = $evidence
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/signing-evidence-$env:TARGET.json"

      - name: Windows-Kompatibilität ohne Authenticode explizit VERIFIZIEREN
        if: runner.os == 'Windows' && inputs.distribution_policy == 'legacy-v0.125'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseRoot = "src/src-tauri/target/$env:TARGET/release"
          $files = @(
            Get-ChildItem -Path $releaseRoot -Filter "*.exe" -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path "$releaseRoot/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          ) | Sort-Object FullName -Unique
          if ($files.Count -lt 2) { throw "Anwendung und NSIS-Installer wurden nicht beide gefunden." }

          $evidence = @()
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne "NotSigned") {
              throw "legacy-v0.125 erwartet ein explizit unsigniertes Artefakt: $($file.Name) / $($signature.Status)"
            }
            $evidence += @{
              file = $file.Name
              sha256 = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
              authenticode_status = $signature.Status.ToString()
            }
          }
          @{
            schema_version = "1.0"
            platform = $env:TARGET
            status = "pass"
            distribution_policy = "legacy-v0.125"
            authenticode_verified = $false
            timestamp_verified = $false
            files = $evidence
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/signing-evidence-$env:TARGET.json"

      - name: Plattform-Signaturbeleg am Draft sichern
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/signing-evidence-$TARGET.json"
          test -s "$EVIDENCE"
          gh release upload "$TAG" "$EVIDENCE" -R "$REPO" --clobber

      - name: Private Trace-Credentials entfernen
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/trace_src"
          git config --global --unset-all url.git@github-trace:subunit-ai/trace-tauri.git.insteadOf || true

  # latest.json FINALISIEREN — deterministisch aus den fertigen Signatur-Assets.
  # Matrix-Jobs laden ausschließlich ihre eigenen Installer und .sig-Dateien hoch;
  # nur dieser nachgelagerte Job schreibt das gemeinsame Updater-Manifest. Damit
  # kann kein paralleler Plattform-Job einen bereits geschriebenen Eintrag verlieren
  # (historisch fehlte bei v0.58.0 windows-aarch64 trotz fertigem Asset).
  manifest:
    name: Signaturen, SBOM und Provenance im Draft
    needs: [release, build]
    if: ${{ always() && needs.release.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Release-Evidence-Werkzeuge auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable

      - name: Exakten Quell-Pin für SBOM auschecken
        env:
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test "${#SOURCE_SHA}" -eq 40
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/scai_src"
          chmod 600 "$HOME/.ssh/scai_src"
          trap 'rm -f "$HOME/.ssh/scai_src"' EXIT
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/scai_src -o IdentitiesOnly=yes"
          git init src
          git -C src config core.autocrlf false
          git -C src config core.eol lf
          git -C src remote add origin git@github.com:subunit-ai/subunit-scai.git
          git -C src fetch --depth 1 origin "$SOURCE_SHA"
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Rust für reproduzierbare CycloneDX-SBOM einrichten
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, immutable pin

      - name: Privaten Trace-Kern für Rust-SBOM freischalten (read-only)
        env:
          TRACE_DEPLOY_KEY: ${{ secrets.TRACE_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "${TRACE_DEPLOY_KEY:-}"
          printf '%s\n' "$TRACE_DEPLOY_KEY" > "$HOME/.ssh/trace_src"
          chmod 600 "$HOME/.ssh/trace_src"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-trace
            HostName github.com
            User git
            IdentityFile ~/.ssh/trace_src
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"
          git config --global url."git@github-trace:subunit-ai/trace-tauri.git".insteadOf \
            "https://github.com/subunit-ai/trace-tauri.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Vollständige Node- und Rust-SBOM erzeugen und zusammenführen
        env:
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src/src-tauri/tauri.conf.json').version")
          SOURCE_DATE_EPOCH=$(git -C src show -s --format=%ct HEAD)
          TIMESTAMP=$(python3 - "$SOURCE_DATE_EPOCH" <<'PY'
          import datetime, sys
          print(datetime.datetime.fromtimestamp(int(sys.argv[1]), datetime.timezone.utc).isoformat().replace("+00:00", "Z"))
          PY
          )
          npm exec --yes --package=@cyclonedx/cyclonedx-npm@6.0.1 -- \
            cyclonedx-npm --package-lock-only --omit dev --spec-version 1.5 \
            --output-reproducible --validate --output-file "$RUNNER_TEMP/scai-node.cdx.json" \
            src/package.json
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" cargo cyclonedx \
            --manifest-path src/src-tauri/Cargo.toml --format json --spec-version 1.5 \
            --all --override-filename scai-rust.cdx
          RUST_SBOM=$(find src/src-tauri -maxdepth 1 -name 'scai-rust.cdx*.json' -print -quit)
          test -s "$RUST_SBOM"
          node scripts/merge-cyclonedx.mjs \
            "$RUNNER_TEMP/scai-node.cdx.json" "$RUST_SBOM" "$RUNNER_TEMP/scai.cdx.json" \
            scai "$VERSION" "$SOURCE_SHA" "$TIMESTAMP"
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5" and (.components | length > 0)' \
            "$RUNNER_TEMP/scai.cdx.json" >/dev/null

      - name: Draft-Assets laden, Update-Signaturen verifizieren und latest.json finalisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          DISTRIBUTION_POLICY: ${{ inputs.distribution_policy }}
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft)
          BODY=$(gh release view "$TAG" -R "$REPO" --json body --jq .body)
          if [ "$IS_DRAFT" != "true" ] || ! printf '%s' "$BODY" | grep -Fq "Source-SHA: $SOURCE_SHA"; then
            echo "::error::$TAG ist kein zum Source-Pin gehörender Draft."
            exit 1
          fi
          ASSET_DIR="$RUNNER_TEMP/scai-release-$TAG"
          mkdir -p "$ASSET_DIR"
          gh release download "$TAG" -R "$REPO" --dir "$ASSET_DIR" --clobber
          cd "$ASSET_DIR"
          cp "$RUNNER_TEMP/scai.cdx.json" scai.cdx.json
          [ -f latest.json ] && cp latest.json existing.json || true
          python3 - "$TAG" "$REPO" <<'PY'
          import json, os, sys, datetime
          tag, repo = sys.argv[1], sys.argv[2]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          # Suffix → Plattform-Keys (exakt die 11 Keys der bisherigen Releases).
          def keys_for(asset):
              if asset.endswith(".app.tar.gz"):
                  arch = "aarch64" if "aarch64" in asset else "x86_64"
                  return [f"darwin-{arch}", f"darwin-{arch}-app"]
              if asset.endswith(".AppImage"): return ["linux-x86_64", "linux-x86_64-appimage"]
              if asset.endswith(".deb"): return ["linux-x86_64-deb"]
              if asset.endswith("-setup.exe"):
                  arch = "aarch64" if "arm64" in asset else "x86_64"
                  return [f"windows-{arch}", f"windows-{arch}-nsis"]
              return []
          platforms = {}
          for sig in sorted(os.listdir(".")):
              if not sig.endswith(".sig"): continue
              asset = sig[:-4]
              signature = open(sig).read().strip()
              for k in keys_for(asset):
                  platforms[k] = {"signature": signature, "url": f"{base}/{asset}"}
          notes, pub = f"SCAI {tag}", datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")
          existing = {}
          try:
              existing = json.load(open("existing.json", encoding="utf-8-sig"))
              notes = existing.get("notes", notes); pub = existing.get("pub_date", pub)
          except Exception: pass
          manifest = {"version": tag.lstrip("v"), "notes": notes, "pub_date": pub, "platforms": platforms}
          required = {
              "darwin-aarch64", "darwin-aarch64-app",
              "darwin-x86_64", "darwin-x86_64-app",
              "windows-aarch64", "windows-aarch64-nsis",
              "windows-x86_64", "windows-x86_64-nsis",
              "linux-x86_64", "linux-x86_64-appimage", "linux-x86_64-deb",
          }
          missing = sorted(required - set(platforms))
          unexpected = sorted(set(platforms) - required)
          if missing or unexpected:
              print(f"::error::Updater-Zielmatrix unvollständig/falsch — fehlend: {missing}; unerwartet: {unexpected}")
              raise SystemExit(1)
          checks = {
              "darwin-aarch64": "aarch64",
              "darwin-x86_64": "x64",
              "windows-aarch64": "arm64",
              "windows-x86_64": "x64",
          }
          wrong = sorted(k for k, marker in checks.items() if marker not in platforms[k]["url"])
          if wrong:
              print(f"::error::Updater-Ziele zeigen auf die falsche Architektur: {wrong}")
              raise SystemExit(1)
          print("Geräteauswahl belegt: macOS ARM/Intel + Windows ARM64/x64 + Linux x64 vollständig.")
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(f"Deterministisch geschrieben: {len(platforms)} Plattform-Keys.")
          PY

          node - "$GITHUB_WORKSPACE/src/src-tauri/tauri.conf.json" > updater.pub <<'NODE'
          const config = require(process.argv[2]);
          process.stdout.write(Buffer.from(config.plugins.updater.pubkey, "base64").toString("utf8"));
          NODE
          sudo apt-get update
          sudo apt-get install -y minisign
          SIG_COUNT=0
          while IFS= read -r -d '' signature; do
            artifact="${signature%.sig}"
            test -s "$artifact"
            minisign -Vm "$artifact" -x "$signature" -p updater.pub
            SIG_COUNT=$((SIG_COUNT + 1))
          done < <(find . -maxdepth 1 -type f -name '*.sig' -print0)
          if [ "$SIG_COUNT" -lt 6 ]; then
            echo "::error::Nur $SIG_COUNT Updater-Signaturen gefunden; erwartet werden mindestens 6."
            exit 1
          fi
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-pc-windows-msvc x86_64-pc-windows-msvc; do
            jq -e --arg target "$target" --arg policy "$DISTRIBUTION_POLICY" \
              '.status == "pass" and .platform == $target and .distribution_policy == $policy' \
              "signing-evidence-$target.json" >/dev/null
          done

          rm -f existing.json updater.pub
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS
          test -s SHA256SUMS
          gh release upload "$TAG" latest.json scai.cdx.json SHA256SUMS -R "$REPO" --clobber
          echo "ASSET_DIR=$ASSET_DIR" >> "$GITHUB_ENV"

      - name: SLSA-Provenance für alle Release-Assets attestieren
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1, immutable
        with:
          subject-checksums: ${{ env.ASSET_DIR }}/SHA256SUMS

      - name: CycloneDX-SBOM an alle Release-Assets binden
        id: sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1, immutable
        with:
          subject-checksums: ${{ env.ASSET_DIR }}/SHA256SUMS
          sbom-path: ${{ env.ASSET_DIR }}/scai.cdx.json

      - name: Provenance und SBOM unabhängig mit gh verifizieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$ASSET_DIR"
          while read -r digest artifact; do
            test "${#digest}" -eq 64
            gh attestation verify "$artifact" --repo "$REPO" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$REPO/.github/workflows/build-all.yml" >/dev/null
            gh attestation verify "$artifact" --repo "$REPO" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$REPO/.github/workflows/build-all.yml" \
              --predicate-type https://cyclonedx.org/bom >/dev/null
          done < SHA256SUMS

      - name: Draft nach technischen Gates bewusst unveröffentlicht lassen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          DISTRIBUTION_POLICY: ${{ inputs.distribution_policy }}
        run: |
          set -euo pipefail
          RELEASE=$(gh release view "$TAG" -R "$REPO" --json isDraft,body,assets)
          test "$(jq -r .isDraft <<<"$RELEASE")" = "true"
          BODY=$(jq -r .body <<<"$RELEASE")
          printf '%s' "$BODY" | grep -Fq "Source-SHA: $SOURCE_SHA"
          printf '%s' "$BODY" | grep -Fq "Fleet-Release-ID: $RELEASE_ID"
          printf '%s' "$BODY" | grep -Fq "Distribution-Policy: $DISTRIBUTION_POLICY"
          jq '{draft:.isDraft, assets:(.assets|length)}' <<<"$RELEASE"
          echo "Technisches Draft-Evidence für $DISTRIBUTION_POLICY vollständig; dieser Workflow veröffentlicht nie."

      - name: Private Trace-Credentials entfernen
        if: always()
        run: |
          rm -f "$HOME/.ssh/trace_src"
          git config --global --unset-all url.git@github-trace:subunit-ai/trace-tauri.git.insteadOf || true
