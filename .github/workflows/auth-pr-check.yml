# subunit-auth — SHA-gebundener PR-Check fuer das PRIVATE Quell-Repo.
#
# Public-Runner-Ersatz fuer die billing-gesperrte private CI. Checkt genau einen
# vollstaendigen SHA read-only aus; Quellcode bleibt fluechtig, wird nie
# veroeffentlicht. Spiegelt den subunit-auth-Job aus fleet-source-check.yml.

name: subunit-auth PR Check (private source)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Vollstaendiger subunit-auth Commit-SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-pr-check-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  consent-dsar:
    name: subunit-auth consent, DSAR and boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      DATABASE_URL: postgres://release-gate:release-gate@127.0.0.1:9/release-gate
      RESEND_API_KEY: release-gate-no-network
    steps:
      - name: Oeffentliche Gate-Tools auschecken
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
        with:
          path: gate
          persist-credentials: false
      - name: Commit-Pin pruefen
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "PASS auth-source-pin (source-sha=$SOURCE_SHA)"
      - name: Gepinntes Bun einrichten
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, immutable
        with:
          bun-version: 1.3.14
      - name: Ephemere JWT-Testschluessel erzeugen
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/jwt-private.pem" >/dev/null 2>&1
          openssl rsa -pubout -in "$RUNNER_TEMP/jwt-private.pem" \
            -out "$RUNNER_TEMP/jwt-public.pem" >/dev/null 2>&1
          echo "JWT_PRIVATE_KEY_PATH=$RUNNER_TEMP/jwt-private.pem" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=$RUNNER_TEMP/jwt-public.pem" >> "$GITHUB_ENV"
      - name: subunit-auth exakt und read-only auschecken
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.AUTH_SOURCE_DEPLOY_KEY }}
        run: bash gate/scripts/checkout-private-source.sh subunit-auth git@github.com:subunit-ai/subunit-auth.git "$SOURCE_SHA"
      - name: Abhaengigkeiten installieren
        working-directory: private/subunit-auth
        run: bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" auth-install bun install --frozen-lockfile
      - name: Auth-/Privacy-Suite und Bundle
        working-directory: private/subunit-auth
        run: |
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" auth-tests bun test
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" auth-build bun build src/server.ts --target bun --outdir "$RUNNER_TEMP/subunit-auth-build"
          bash "$GITHUB_WORKSPACE/gate/scripts/run-confidential.sh" auth-deploy-gate bash -n scripts/deploy.sh
      - name: Temporaeren privaten Checkout entfernen
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private/subunit-auth"
      - name: Ephemere JWT-Testschluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/jwt-private.pem" "$RUNNER_TEMP/jwt-public.pem"
