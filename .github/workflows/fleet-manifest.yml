name: Fleet-Manifest prüfen

on:
  pull_request:
    paths:
      - "fleet/**"
      - "scripts/verify-fleet-manifest.mjs"
      - "scripts/verify-fleet-manifest.test.mjs"
      - "scripts/verify-release-workflow.mjs"
      - "scripts/verify-release-workflow.test.mjs"
      - "scripts/run-confidential.sh"
      - "scripts/run-confidential.test.mjs"
      - "scripts/run-package-smoke.sh"
      - "scripts/run-package-smoke.ps1"
      - "scripts/validate-release-assets.sh"
      - "scripts/validate-release-assets.test.mjs"
      - "scripts/verify-source-confidentiality.mjs"
      - "scripts/verify-source-confidentiality.test.mjs"
      - "scripts/checkout-private-source.sh"
      - "scripts/checkout-private-source.test.mjs"
      - "scripts/verify-fleet-source-workflow.mjs"
      - "scripts/verify-fleet-source-workflow.test.mjs"
      - "scripts/verify-market-evidence-binding.mjs"
      - "scripts/verify-market-evidence-binding.test.mjs"
      - "scripts/merge-cyclonedx.mjs"
      - "scripts/merge-cyclonedx.test.mjs"
      - "scripts/verify-readiness-evidence.mjs"
      - "scripts/verify-readiness-evidence.test.mjs"
      - "scripts/verify-runtime-evidence.mjs"
      - "scripts/verify-runtime-evidence.test.mjs"
      - ".github/workflows/build-all.yml"
      - ".github/workflows/pr-check.yml"
      - ".github/workflows/publish-approved.yml"
      - ".github/workflows/windows-arm-smoke.yml"
      - ".github/workflows/fleet-source-check.yml"
      - ".github/workflows/fleet-manifest.yml"
  push:
    branches: [main]
    paths:
      - "fleet/**"
      - "scripts/verify-fleet-manifest.mjs"
      - "scripts/verify-fleet-manifest.test.mjs"
      - "scripts/verify-release-workflow.mjs"
      - "scripts/verify-release-workflow.test.mjs"
      - "scripts/run-confidential.sh"
      - "scripts/run-confidential.test.mjs"
      - "scripts/run-package-smoke.sh"
      - "scripts/run-package-smoke.ps1"
      - "scripts/validate-release-assets.sh"
      - "scripts/validate-release-assets.test.mjs"
      - "scripts/verify-source-confidentiality.mjs"
      - "scripts/verify-source-confidentiality.test.mjs"
      - "scripts/checkout-private-source.sh"
      - "scripts/checkout-private-source.test.mjs"
      - "scripts/verify-fleet-source-workflow.mjs"
      - "scripts/verify-fleet-source-workflow.test.mjs"
      - "scripts/verify-market-evidence-binding.mjs"
      - "scripts/verify-market-evidence-binding.test.mjs"
      - "scripts/merge-cyclonedx.mjs"
      - "scripts/merge-cyclonedx.test.mjs"
      - "scripts/verify-readiness-evidence.mjs"
      - "scripts/verify-readiness-evidence.test.mjs"
      - "scripts/verify-runtime-evidence.mjs"
      - "scripts/verify-runtime-evidence.test.mjs"
      - ".github/workflows/build-all.yml"
      - ".github/workflows/pr-check.yml"
      - ".github/workflows/publish-approved.yml"
      - ".github/workflows/windows-arm-smoke.yml"
      - ".github/workflows/fleet-source-check.yml"
      - ".github/workflows/fleet-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Manifest- und Release-Verträge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, immutable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: 22
      - name: Validator testen
        run: node --test scripts/*.test.mjs
      - name: Alle Fleet-Manifeste prüfen
        run: node scripts/verify-fleet-manifest.mjs
      - name: Release-Workflow fail-closed prüfen
        run: node scripts/verify-release-workflow.mjs
      - name: Public-CI-Vertraulichkeit fail-closed prüfen
        run: node scripts/verify-source-confidentiality.mjs
      - name: Private Fleet-Source-CI fail-closed prüfen
        run: node scripts/verify-fleet-source-workflow.mjs
      - name: Ops- und Markt-Evidence-Templates prüfen
        run: node scripts/verify-readiness-evidence.mjs fleet/evidence/operations-template.json fleet/evidence/market-template.json
