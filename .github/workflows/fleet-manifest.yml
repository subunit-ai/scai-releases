name: Fleet-Manifest prüfen

on:
  pull_request:
    paths:
      - "fleet/**"
      - "scripts/verify-fleet-manifest.mjs"
      - "scripts/verify-fleet-manifest.test.mjs"
      - ".github/workflows/fleet-manifest.yml"
  push:
    branches: [main]
    paths:
      - "fleet/**"
      - "scripts/verify-fleet-manifest.mjs"
      - "scripts/verify-fleet-manifest.test.mjs"
      - ".github/workflows/fleet-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Schema und Fail-closed-PASS-Vertrag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validator testen
        run: node --test scripts/verify-fleet-manifest.test.mjs
      - name: Alle Fleet-Manifeste prüfen
        run: node scripts/verify-fleet-manifest.mjs
